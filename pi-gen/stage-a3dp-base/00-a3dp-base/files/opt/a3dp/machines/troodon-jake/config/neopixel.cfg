################## NEOPIXEL CONFIGURATION ##################################################################################################################################################################

[neopixel neopixel]
PIN: PC24    #CONN_LCD Pin5
#   The pin connected to the neopixel. This parameter must be
#   provided.
chain_count: 84 #60 #24 #18 #24 #18 
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRB
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, BRG, BGR, GRBW, or RGBW. The default is GRB.
initial_RED: 0.50
initial_GREEN: 0.50
initial_BLUE: 0.50
#initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.

############# Neopixel Macros ##############################################################################################################################################################################

[gcode_macro LED_OFF]
gcode:
  StopLEDEffects
  SET_LED LED=neopixel RED=0.0 GREEN=0.0 BLUE=0.0

[gcode_macro Panel_IDLE]
gcode:
  SET_LED_EFFECT EFFECT=panel_idle

[gcode_macro LED_ON]
gcode:
  StopLEDEffects
  SET_LED LED=neopixel RED=0.50 GREEN=0.50 BLUE=0.50 

[gcode_macro LED_RED]
gcode:
  StopLEDEffects
  SET_LED LED=neopixel RED=0.50 GREEN=0.0 BLUE=0.0

[gcode_macro LED_GREEN]
gcode:
  StopLEDEffects
  SET_LED LED=neopixel RED=0.0 GREEN=0.50 BLUE=0.0

[gcode_macro LED_BLUE]
gcode:
  StopLEDEffects
  SET_LED LED=neopixel RED=0.0 GREEN=0.0 BLUE=0.50

[gcode_macro StopLEDEffects]
gcode:
  stop_led_effects
  G4 P2000
  SET_LED LED=neopixel RED=0.50 GREEN=.50 BLUE=0.50

