# Heaters — moved verbatim from live printer.cfg 2026-11-15 (t_a0980f4a)
[extruder]
step_pin:head0:PD3
dir_pin:head0:PD2
enable_pin: !head0:PB6
heater_pin: head0:PB0  # "HEAT"
rotation_distance :7.8  ##14t ##5.2 nema 14
microsteps: 32
nozzle_diameter: 0.800
filament_diameter: 1.750
sensor_type: PT1000
sensor_pin: head0:PA1 # "THERMISTOR"
pullup_resistor: 2200 # The board uses a 2.2k ohm pullup to work with a PT1000 
min_temp: -50
max_temp: 550
max_extrude_only_distance: 251.0
pressure_advance : .01
pressure_advance_smooth_time: .01
#smooth_time: .1
control: mpc
heater_power: 130  
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 
max_extrude_cross_section: 5
#per_move_pressure_advance: True
[tmc2209 extruder]
uart_pin: head0:PB3
#interpolate: True
#run_current: 0.767
#sense_resistor: 0.110
#hold_current: 0.2
#stealthchop_threshold: 0
#driver_TBL: 0
#driver_HEND: 7
#driver_HSTRT: 7
#driver_TOFF: 3
interpolate: False
run_current: .61
sense_resistor: 0.110
hold_current: 0.3
#stealthchop_threshold: 0
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 4
driver_TOFF: 5

