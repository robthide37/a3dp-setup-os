# printer.cfg — a3dpTR300 (Formbot Troodon 300)
# Modular layout applied 2026-11-13 (task t_5351bc6a, Rob-approved report §7).
# Hardware sections live in hardware/*.cfg, calibration in calibration/, macros in macros/.
# All values moved verbatim — zero value edits.
# The SAVE_CONFIG block below carries all calibrated overrides
# (bed mesh, PID, input shaper, probe z_offset) — DO NOT EDIT IT.

[gcode_macro SET_MY_VARIABLE]
variable_my_variable: 0
gcode:
  SET_GCODE_VARIABLE MACRO=SET_MY_VARIABLE VARIABLE=my_variable VALUE={value}
[gcode_macro SAVE_MY_VARIABLE]
gcode:
  SET_GCODE_VARIABLE MACRO=SET_MY_VARIABLE VARIABLE=my_variable VALUE={value}
  SAVE_CONFIG
[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    The folder where the results will be stored. It will be created if it doesn't exist.
number_of_results_to_keep: 3
#    The number of results to keep in the result_folder. The oldest results will
#    be automatically deleted after each runs.
#    If True, the raw CSV files will be kept in the result_folder alongside the
#    PNG graphs. If False, they will be deleted and only the graphs will be kept.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for "system" macros that are not in the
#    printer.cfg file. If you want to see the macros in the webui, set this to True.
timeout: 300
#    The maximum time in seconds to let Shake&Tune process the CSV files and generate the graphs.
[exclude_object]

# Enable arcs support for OrcaSlicer
[gcode_arcs]
resolution: 0.1
[printer]
kinematics: corexy
max_velocity: 2000 #800
max_accel:30000
#max_accel_to_decel:7000
square_corner_velocity:5
max_z_velocity: 80 #100
max_z_accel: 420 #360
[force_move]
enable_force_move: True

# --- includes ---
[include macros/variables.cfg]
[include macros/compat.cfg]
[include hardware/board-mcu.cfg]
[include hardware/kinematics-xyservos.cfg]
[include hardware/kinematics-zduex.cfg]
[include hardware/extruder.cfg]
[include hardware/bed-gantry.cfg]
[include hardware/fans-outputs.cfg]
[include hardware/probe.cfg]
[include hardware/sensors.cfg]
[include hardware/shaper.cfg]
[include calibration/euclid.cfg]
[include macros/system.cfg]
[include macros/prints.cfg]
[include macros/lights.cfg]
[include timelapse.cfg]
[include neopixel.cfg]
[include moonraker_obico_macros.cfg]

