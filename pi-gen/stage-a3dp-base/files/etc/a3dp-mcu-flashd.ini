# a3dp-mcu-flashd — service config (deployed to /etc/a3dp-mcu-flashd.ini)
# The flasher is the Klipper-INDEPENDENT recovery path: it flashes rp2040
# boards in BOOTSEL mode (USB mass storage mount/cp/umount) or sitting in
# the katapult bootloader (usb-katapult_* serial, via katapult flashtool.py)
# with no klipper, no moonraker, no klippy. The klippy FLASH_MCU macro /
# moonraker-mcu-flasher remains the happy path for routine updates.
# This is the ONLY flasher on a kit unit (:8082 via nginx; stray a3dp-flashd
# :8081 decommissioned 2026-10-31).
[service]
# bind localhost only; nginx site a3dp-mcu-flash (:8082) proxies with LAN allowlist
listen = 127.0.0.1
port = 7130
# versioned firmware store — drop .uf2 named <board>-<version>.uf2 here
# (absolute paths: the service runs as root, so ~ would expand to /root)
firmware_dir = /home/pi/printer_data/config/firmware
# board-name map: A3dp/flash mcus.ini sections [name] with by-id paths
mcus_ini = /home/pi/printer_data/config/meter-kit/mcus.ini
# best-effort firmware-version display (parsed from klippy.log when present)
klippy_log = /home/pi/printer_data/logs/klippy.log
# katapult bootloader flashtool (boards enumerating as usb-katapult_*)
katapult_flashtool = /home/pi/katapult/scripts/flashtool.py
