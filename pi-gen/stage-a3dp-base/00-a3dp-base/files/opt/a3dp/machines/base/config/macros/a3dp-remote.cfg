# A3DP remote-access + monitor macros — shipped in EVERY machine profile.
# Backed by the [gcode_shell_command] sections BELOW (klippy side — Kalico's
# gcode_shell_command is a klippy extra, not a Moonraker component; they used
# to sit in moonraker.conf and produced failed_components + dead macros at
# first boot, rift-525 customer unit .92 2026-11-13).
# Surface: Mainsail Macros panel / KlipperScreen macros — no SSH needed.
# See README "Customer onboarding" for the full flows.

[gcode_macro REMOTE_SETUP]
description: Join a Tailscale tailnet (no SSH): prints the auth URL to the console and writes tailscale-auth-url.txt to the Jobs list
gcode:
    { action_respond_info("REMOTE_SETUP: starting tailscale login (background). The auth URL appears here in the console and in the file tailscale-auth-url.txt in the Jobs list. Open it on a device signed into YOUR tailnet and approve this printer.") }
    RUN_SHELL_COMMAND CMD=a3dp_remote_setup
    { action_respond_info("REMOTE_SETUP: check the console output above (or tailscale-auth-url.txt) for the auth URL.") }

[gcode_macro RESTART_MONITOR]
description: Restart the AI print-monitor services after pasting llamaswap.key / confirm.token via the Mainsail file manager
gcode:
    { action_respond_info("RESTART_MONITOR: restarting enabled AI services (monitor timer + confirm listener).") }
    RUN_SHELL_COMMAND CMD=a3dp_restart_monitor

[gcode_shell_command a3dp_remote_setup]
command: /usr/local/sbin/a3dp-remote-setup
timeout: 90
verbose: True

[gcode_shell_command a3dp_restart_monitor]
command: /usr/local/sbin/a3dp-monitor-restart
timeout: 30
verbose: True
