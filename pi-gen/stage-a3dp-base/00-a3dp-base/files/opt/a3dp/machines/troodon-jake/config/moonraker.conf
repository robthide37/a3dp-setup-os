# troodon-jake moonraker.conf = fleet canonical conf (opt/a3dp/shared/moonraker.conf,
# v0.1.3 line) + this machine's three additions:
#   [octoprint_compat]   — Jake's live conf had it; kept as slicer-upload insurance
#   [paneldue]           — PanelDue on ttyAMA0 (hardware panel, KEEP decision)
#   [update_manager moonraker-obico] — Obico STAYS (Rob's Track A redirect:
#                          comparison baseline, no frames leave the machine)
# Obico's auth token lives in ~/printer_data/config/moonraker-obico.cfg —
# machine-local secret, restored from the pre-migration backup (runbook §5).
# Rebase this file onto the canonical conf when the image's copy changes.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/pi/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    127.0.0.1
    ::1
    192.168.0.0/16
    10.0.0.0/8
    100.64.0.0/10
cors_domains:
    http://*.local
    http://*.lan

[database]
database_path: /home/pi/printer_data/database

# NOTE: no [job_history] here — the moonraker-job-history extension is not
# shipped in the image (it failed at first boot on the rift-525 customer unit,
# 2026-11-13). Moonraker's built-in [history] component loads by default and
# Mainsail's job list runs off it.

[octoprint_compat]

[update_manager]
enable_auto_refresh: True

[update_manager klipper]
type: git_repo
path: /home/pi/klipper
origin: https://github.com/KalicoCrew/kalico.git
install_script: scripts/install-debian.sh
managed_services: klipper

[update_manager moonraker]
type: git_repo
path: /home/pi/moonraker
origin: https://github.com/Arksine/moonraker.git
managed_services: moonraker

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /var/www/html

[update_manager crowsnest]
type: git_repo
path: /home/pi/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
primary_branch: v5
managed_services: crowsnest
system_dependencies: system-dependencies.json
virtualenv: /home/pi/crowsnest-env
requirements: requirements.txt

[update_manager mcu_flasher]
type: git_repo
path: /home/pi/moonraker-mcu-flasher
origin: https://github.com/juliapythoncpp/moonraker-mcu-flasher.git
managed_services: klipper moonraker

[update_manager timelapse]
# moonraker-timelapse IS shipped (component symlinked in stage 02). The
# requirements: line pointed at a file that does not exist in that repo and
# failed the whole extension at first boot on .92 (2026-11-13) — the component
# is stdlib + tornado (moonraker-env), no extra pip deps. Shape mirrors the
# live Rift (.219).
type: git_repo
path: /home/pi/moonraker-timelapse
origin: https://github.com/mainsail-crew/moonraker-timelapse.git
primary_branch: main
managed_services: klipper moonraker

[update_manager moonraker-obico]
# Installed at migration time (git clone + venv, moonraker-obico.service) —
# not an image component. Entry shape from the machine's live
# moonraker-obico-update.cfg.
type: git_repo
path: /home/pi/moonraker-obico
origin: https://github.com/TheSpaghettiDetective/moonraker-obico.git
env: /home/pi/moonraker-obico-env/bin/python
requirements: requirements.txt
install_script: install.sh
managed_services: moonraker-obico

[timelapse]

# ---- PanelDue (KEEP decision, t_1a6643fd) ----
# Physical panel on the Pi's primary UART (ttyAMA0). Sections verbatim from
# the machine's live moonraker.conf.
[paneldue]
serial: /dev/ttyAMA0
baud: 57600
machine_name: A3DP TR300
macros:
 LOAD_FILAMENT
 UNLOAD_FILAMENT
 LIGHTS_ON
confirmed_macros:
