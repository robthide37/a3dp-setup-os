# a3dpmeter — mcus.ini for A3dp/flash/update_klipper.sh (UKAM)
# Run: ~/printer_data/config/A3dp/flash/update_klipper.sh ~/printer_data/config/meter-kit/mcus.ini
# Board set (Rob-confirmed 2026-11-03): main = BTT Octopus Pro (STM32H723),
# toolheads = 2x LDO NiteHawk-36 (rp2040). rp2040 caveat: BOOTSEL needed on a
# blank board. stm32h723 flashes buttonless via ROM DFU (dfu-util; verified
# 2026-11-02, t_f1891ed8).
[a3dpmain]
# BTT Octopus (STM32H723) main board. Ships w/ bootloader at 0x08000000;
# klipper app at 128 KiB offset (0x08020000). Buttonless re-flash: make flash
# reboots the running klipper into ROM DFU (needs dfu-util). Label matches
# family naming (Brent config [mcu] a3dpmain).
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32h723xx_360008000851323235363233-if00

[head0]
# PRIM toolhead — LDO NiteHawk-36, chip-id ...864E (ttyACM0 path today).
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_313631313202864E-if00

[head1]
# SEC toolhead — LDO NiteHawk-36, chip-id ...9F6A (ttyACM1 path today).
action_command: make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_3136313132029F6A-if00
