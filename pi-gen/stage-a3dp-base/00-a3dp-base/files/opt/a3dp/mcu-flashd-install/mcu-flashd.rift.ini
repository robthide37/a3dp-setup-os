# a3dp-mcu-flashd — service config, RIFT (a3dp525) variant (t_edfb2f69 2026-11-13)
# Same design as the a3dpmeter variant; only the mcus.ini path differs
# (Rift keeps the original A3dp/flash layout, not meter-kit/).
[service]
listen = 127.0.0.1
port = 7130
firmware_dir = /home/pi/printer_data/config/firmware
mcus_ini = /home/pi/printer_data/config/flash/mcus.ini
config_dir = /home/pi/printer_data/config/flash/config
klipper_dir = /home/pi/klipper
klippy_log = /home/pi/printer_data/logs/klippy.log
katapult_flashtool = /home/pi/katapult/scripts/flashtool.py
