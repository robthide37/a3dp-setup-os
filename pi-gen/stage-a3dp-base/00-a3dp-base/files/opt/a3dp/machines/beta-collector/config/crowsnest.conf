# beta-collector camera lane: bundled 1080p USB webcam (Microdia 0c45:6369
# family — MJPEG-only at 1080p), same config family as the proven Rift lane.
# ustreamer serves the MJPG stream AND snapshots on :8080; the kit collector
# and (if ever needed) A3DP-side pulls both use :8080?action=snapshot.
[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose                      # Valid Options are quiet/verbose/debug
delete_log: false
no_proxy: false

[cam 1]
mode: ustreamer
port: 8080                              # HTTP/MJPG Stream/Snapshot Port
device: /dev/video0                     # the bundled webcam is the only camera on a kit
resolution: 1920x1080                   # installer default 640x480 is inadequate — do not drop
max_fps: 30
custom_flags: --format MJPEG
