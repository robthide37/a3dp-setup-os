[filament_switch_sensor switch_sensor]
switch_pin: PG11
pause_on_runout: False
event_delay: 4.0

runout_gcode:
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        PAUSE
        M117 Filament runout detected
    {% else %}
        {action_respond_info("Runout ignored — printer not actively printing")}
    {% endif %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=0
insert_gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=1
    M117 Filament detected

[filament_motion_sensor encoder_sensor]
switch_pin: PG15
detection_length: 7.2
extruder: extruder
pause_on_runout: False
event_delay: 3.0
runout_gcode:
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        PAUSE
        M117 Filament runout detected
    {% else %}
        {action_respond_info("Runout ignored — printer not actively printing")}
    {% endif %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=0
insert_gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=1
    M117 Filament detected

