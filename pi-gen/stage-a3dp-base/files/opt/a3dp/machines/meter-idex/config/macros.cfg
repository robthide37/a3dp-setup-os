 size_y: 100
 height: 50
 origin_x: 500
 origin_y: 500
 layer_height: 0.2
 first_layer_height: 0.3
 perimeters: 2
 brim_width: 10
 slow_velocity: 20
 fast_velocity: 80
 filament_diameter: 1.75