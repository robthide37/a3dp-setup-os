# a3dpTR300 — stepper_x/y — A3DP Leadshine closed-loop servos, pulse-mode (fspr 4000, 2.5 µs) (split from printer.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[stepper_x]
step_pin: PD6 #PE6
dir_pin: !PD11 #!PA14
enable_pin: !PD14 #!PE0
endstop_pin: head0:PB11 #head0:PA14
rotation_distance: 40
microsteps: 1
full_steps_per_rotation: 4000 #6400
homing_positive_dir: true
position_endstop: 306 #532
position_max: 306 #535
position_min: -2 #-5
homing_speed: 150 #(300)
step_pulse_duration:.0000025
homing_retract_dist: 2
#high_precision_step_compress: True

[stepper_y]
step_pin: PD7 #PE2
dir_pin: !PD12 #!PE3
enable_pin: !PC9 #!PD4
rotation_distance: 40
microsteps: 1
full_steps_per_rotation: 4000 #6400
homing_positive_dir: true
endstop_pin: ^PA2 #PG6
position_endstop: 310  #519
position_max: 315 #526
position_min: -5 #-40
homing_speed: 200
homing_retract_dist: 2
step_pulse_duration:.0000025
#high_precision_step_compress: True
