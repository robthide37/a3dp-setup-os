[gcode_macro EuclidProbe]
description: Store probe positions dynamically
variable_move_speeds: 30000
variable_dock_speeds: 1800
variable_z_speeds: 1800
variable_bed_clearance: 20

variable_position_preflight: [ 270, 60 ] #[ 450, 100 ]
variable_position_side:      [ 275, 0 ] #[ 500,-30 ]
variable_position_dock:      [ 301, 0] #[ 531,-30]
## exit/re-entry staging
variable_position_exit:      [ 301, 30 ] #[ 531, 0 ]
variable_position_center:      [ 150, 155] #[ 262.5, 262.5 ]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if "dock_x" in printer.save_variables.variables and "dock_y" in printer.save_variables.variables %}
        {% set dock_x = svv.dock_x %}
        {% set dock_y = svv.dock_y %}
    {% else %}
        {% set dock_x = variable_position_dock[0] %}
        {% set dock_y = variable_position_dock[1] %}
    {% endif %}

    {% set preflight_x = dock_x - 150 %}
    {% set preflight_y = dock_y + 150 %}
    {% set exit_x = dock_x %}
    {% set exit_y = dock_y + 37 %}
    {% set center_x = printer.toolhead.axis_maximum.x / 2 %}
    {% set center_y = printer.toolhead.axis_maximum.y / 2 %}

    SET_GCODE_VARIABLE MACRO=EuclidProbe VARIABLE=position_dock VALUE=[{dock_x},{dock_y}]
    SET_GCODE_VARIABLE MACRO=EuclidProbe VARIABLE=position_preflight VALUE=[{preflight_x},{preflight_y}]
    SET_GCODE_VARIABLE MACRO=EuclidProbe VARIABLE=position_exit VALUE=[{exit_x},{exit_y}]
    SET_GCODE_VARIABLE MACRO=EuclidProbe VARIABLE=position_center VALUE=[{center_x},{center_y}]
[gcode_macro PRINT_PROBE_POSITIONS]
description: "Display all probe positions from EuclidProbe"
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set center = printer["gcode_macro EuclidProbe"].position_center %}
    {% set preflight = printer["gcode_macro EuclidProbe"].position_preflight %}
    {% set exit_pos = printer["gcode_macro EuclidProbe"].position_dock %}
    M117 Center: {center}
    {action_respond_info("Center: " ~ center ~ " | Preflight: " ~ preflight ~ " | Exit: " ~ exit_pos)}



[gcode_macro USE_EXIT_POSITION]
description: Move toolhead to exit position
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set exit_x = euclid_probe.position_exit[0] %}
    {% set exit_y = euclid_probe.position_exit[1] %}
    G1 X{exit_x} Y{exit_y} F3000


[gcode_macro SET_DOCK]
description: Home X and Y, allow user to move toolhead, then confirm dock
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set dock_x = euclid_probe.position_dock[0] %}
    {% set dock_y = euclid_probe.position_dock[1] %}
    
    {action_respond_info("Move the toolhead to the dock position and press 'OK' to confirm.")}
    RESPOND TYPE=command MSG="Confirm Dock Position" CMD="CONFIRM_DOCK"


[gcode_macro CONFIRM_DOCK]
description: Save the dock position after user confirms
gcode:
    QUERY_PROBE
    {% if printer.probe.last_query == "TRIGGERED" %}
        {action_respond_info("Probe not triggered! Move the toolhead and try again.")}
        RESPOND TYPE=command MSG="Retry Dock Position" CMD="SHOW_MOVE_PROMPT"
    {% else %}
        {% set x = printer.toolhead.position.x %}
        {% set y = printer.toolhead.position.y %}
        SAVE_VARIABLE VARIABLE=dock_x VALUE={x}
        SAVE_VARIABLE VARIABLE=dock_y VALUE={y}
        {action_respond_info("Dock position saved!")}
    {% endif %}

[gcode_macro RETRY_DOCK]
description: Allow user to reposition and retry dock confirmation
gcode:
    {action_respond_info("Move the toolhead to the dock position and press 'OK' to confirm.")}
    RESPOND TYPE=button MSG="Confirm Dock Position" CMD="CONFIRM_DOCK"
[gcode_macro SHOW_MOVE_PROMPT]
description: Display a popup allowing the user to move the toolhead
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    RESPOND TYPE=command MSG="action:prompt_begin Move Toolhead"
    RESPOND TYPE=command MSG="action:prompt_text Move the toolhead to the dock position using the controls below."
    RESPOND TYPE=command MSG="action:prompt_button Move X+1|MOVE_X_POSITIVE|primary"
    RESPOND TYPE=command MSG="action:prompt_button Move X-1|MOVE_X_NEGATIVE"
    RESPOND TYPE=command MSG="action:prompt_button Move Y+1|MOVE_Y_POSITIVE"
    RESPOND TYPE=command MSG="action:prompt_button Move Y-1|MOVE_Y_NEGATIVE"
    RESPOND TYPE=command MSG="action:prompt_button Move Y-10|MOVE_Y_NEGATIVE10"    
    RESPOND TYPE=command MSG="action:prompt_button Confirm Dock|CONFIRM_DOCK|success"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro MOVE_X_POSITIVE]
description: Move toolhead X+1
gcode:
    G91
    G1 X+1 F3000
    G90
    SHOW_MOVE_PROMPT
[gcode_macro MOVE_X_NEGATIVE]
description: Move toolhead X-1
gcode:
    G91
    G1 X-1 F3000
    G90
    SHOW_MOVE_PROMPT
[gcode_macro MOVE_Y_POSITIVE]
description: Move toolhead Y+1
gcode:
    G91
    G1 Y+1 F3000
    G90
    SHOW_MOVE_PROMPT
[gcode_macro MOVE_Y_NEGATIVE]
description: Move toolhead Y-1
gcode:
    G91
    G1 Y-1 F3000
    G90
    SHOW_MOVE_PROMPT
[gcode_macro MOVE_Y_NEGATIVE10]
description: Move toolhead Y-10
gcode:
    G91
    G1 Y-10 F3000
    G90
    SHOW_MOVE_PROMPT


[gcode_macro SET_ZHOME]
description: Save the current dock position
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set z = printer.configfile.config.stepper_z.position_endstop %}
    SAVE_VARIABLE VARIABLE=zhome VALUE={z}
[gcode_macro SAVE_ZHOME]
description: Save the current dock position
gcode:
    {% set z = printer.toolhead.position.z %}
    SAVE_VARIABLE VARIABLE=zhome VALUE={z}

[gcode_macro RESTORE_ZHOME]
description: Restore the saved dock position
gcode:


    G0 Z{printer.save_variables.variables.zhome | float+0.1}

# example homing overide to use Euclid as an endstop and Z-probe
# example assumes that the bed is 300x300
# assumes homing Z at center of bed
# assumes that macro for probe deploy and retract below are called M401 and M403
#
#
[homing_override]
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set svv = printer.save_variables.variables %}
    {% set side_x = euclid_probe.position_side[0] %}
    {% set side_y = euclid_probe.position_side[1] %} 
    {% if "xyz" not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z=0
    {% endif %}
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    SET_ZHOME
#    {% if "xyz" not in printer.toolhead.homed_axes %}
    {% set z = printer.configfile.config.stepper_z.position_endstop %}
     G90
     M204 S2000
     G0 Z{ euclid_probe.bed_clearance } F{ euclid_probe.z_speeds }           ; raise bed to 15               ; home Y & Y
     G28 X 
#     G0 X490 F30000  #for RIFT
     G0 X280 F30000  #for RIFT

     G28 Y                 
     G0 X{ svv.dock_x } Y{ svv.dock_y } F{ euclid_probe.move_speeds }; move to X150 Y150            
     G28 Z ; home Z
     G0 X{ side_x } F{ euclid_probe.move_speeds } 
     G0 Z{ euclid_probe.bed_clearance } F{ euclid_probe.z_speeds }          ; raise bed to 15
     #G0 X383 F12000#M403                  ; retract Euclid Probe

#    {% endif %} 
axes: z


# Macro to Deploy Bed Probe
[gcode_macro M401]
gcode:

    G90
    {action_respond_info("Entering M401")}
    error_if_probe_deployed    ; check to make sure that the probe is not already attached
    _M401

[gcode_macro error_if_probe_deployed]
gcode:
    QUERY_PROBE                 ; check probe status
    do_error_if_probe_deployed  ; logic check to verify probe is not already deployed

[gcode_macro do_error_if_probe_deployed]
gcode:
    {% if not printer.probe.last_query %}
      {action_raise_error("Euclid Probe is already deployed - Remove and Return it to the dock")}
    {% endif %}

# Macro to Deploy Bed Probe
[gcode_macro _M401]
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set dock_x = printer.save_variables.variables.dock_x %}
    {% set dock_y = printer.save_variables.variables.dock_y %}
    {% set exit_x = euclid_probe.position_exit[0] %}
    {% set exit_y = euclid_probe.position_exit[1] %}
    SAVE_GCODE_STATE NAME=printready
    G90
    {% if printer.probe.last_query %} 
      G0 Z{ euclid_probe.bed_clearance } F{ euclid_probe.z_speeds }         ;  set approach elevation of Z15 to clear probe over bed on fixed gantry machine
      #                       for moving gantry machine this may need to be adjusted
      G0 X{ dock_x } Y{ dock_y } F{ euclid_probe.dock_speeds }          ;  move the carraige to safe position to move from
      RESTORE_ZHOME        ;  move above of the dock
      G4 P250              ;  wait 1/4 second 
      G0 X{ exit_x } Y{ exit_y }             ;  move out of dock to pick up probe
      M400                 ;  wait for moves to finish
      ;G4 P250              ;  pause 1/4 sec for detection           ;  move out of the dock in a straight line 
      G0 Z{ euclid_probe.bed_clearance }               ;  move up to clear the probe over the bed of moving gantry or provide clearance for fixed gantry
      #G0 X200 Y200         ;  move probe to center of bed in ready position 
    {% endif %}
    error_if_probe_not_deployed
    RESTORE_GCODE_STATE NAME=printready
    {action_respond_info("Euclid")}

[gcode_macro error_if_probe_not_deployed]
gcode:
    QUERY_PROBE
    do_error_if_probe_not_deployed

[gcode_macro do_error_if_probe_not_deployed]
gcode:
    {% if printer.probe.last_query %}
      {action_raise_error("Euclid Probe failed to deploy!")}
    {% endif %}

# Macro to retract Bed Probe
[gcode_macro M402]
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    G90
    {action_respond_info("Entering M403")}
    error_if_probe_not_deployed
    _M402

[gcode_macro _M402]
gcode:

    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set dock_x = printer.save_variables.variables.dock_x %}
    {% set dock_y = printer.save_variables.variables.dock_y %}
    {% set exit_x = euclid_probe.position_exit[0] %}
    {% set exit_y = euclid_probe.position_exit[1] %}
    {% set side_x = euclid_probe.position_side[0] %}
    {% set side_y = euclid_probe.position_side[1] %}
    {% set preflight_x = euclid_probe.position_preflight[0] %}
    {% set preflight_y = euclid_probe.position_preflight[1] %}     
    G90
    {% if not printer.probe.last_query %} ; the logic on this needs function check
      G0 Z30 F{ euclid_probe.z_speeds }                   ;  set approach elevation of Z15 for fixed gantry system to clear probe over bed
      #                             ;  for moving gantry system this may have to be altered to match your dock elevation
      G0 X{ dock_x| float-6 } Y{ dock_y } F{ euclid_probe.move_speeds }           ;  start movements at center of the bed 
      PROBE
      G91 
      G0 Z5
      G90
      G0 X{ exit_x } Y{ exit_y } F{ euclid_probe.move_speeds }              ;  move to a position in front of the dock so simple linear movement into dock 
      G91
      G0 Z-14.6
      G90
      G0 X{ dock_x } Y{ dock_y } F{ euclid_probe.dock_speeds }    
      SAVE_ZHOME ;  slowly move into dock 
      M400                          ;  wait for moves to finish
      G4 P250                       ;  forced pause here so motion is definite 90 tavel to swipe
      G0 X{ side_x } Y{ side_y } F{ euclid_probe.move_speeds }               ;  quick swipe off 
      G0 X{ preflight_x } Y{ preflight_y } Z{ euclid_probe.bed_clearance } F{ euclid_probe.move_speeds }                  ;  move to front center of bed                   
    {% endif %}                     ;  exit the if-then loop. was missing in previous versions
    error_if_probe_deployed         ;  verify that the probe is detached. is corrected error  
    {action_respond_info("Stow Probe")}
# Macro to Deploy Probe attached to bed, requires force_move


# Macro to Deploy Probe attached to bed, requires force_move

# Macro to perform a bed mesh calibration by wrapping it between M401/M403 macros
[gcode_macro BED_MESH_CALIBRATE]
rename_existing:    BED_MESH_CALIBRATE_ORIGINAL
gcode:
  M401                           ; deploy Euclid Probe if needed
  BED_MESH_CALIBRATE_ORIGINAL    ; check bed level
  M402                       ; dock Euclid Probe

# Macro to perform a modified z_tilt  by wrapping it between M401/M403 macros
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing:    _QUAD_GANTRY_LEVEL_ORIGINAL
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
    {% set preflight_x = euclid_probe.position_preflight[0] %}
    {% set preflight_y = euclid_probe.position_preflight[1] %}    
  M401                           ; deploy Euclid Probe if needed
  _QUAD_GANTRY_LEVEL_ORIGINAL         ; check bed level
  G0 X{ preflight_x } Y{ preflight_y } F{ euclid_probe.move_speeds }
   Probe
   offset
  M402                           ; dock Euclid Probe
[gcode_macro HOMETEST]
gcode: 
    {% set center_x = euclid_probe.position_center[0] %}
    {% set center_y = euclid_probe.position_center[1] %}    
  SET_KINEMATIC_POSITION Z={printer.configfile.config.stepper_z.position_endstop}
  G28
  M401
  G0 X{ center_x } Y{ center_y }
  probe
  offset
  G0 Z{ euclid_probe.bed_clearance } F{ euclid_probe.z_speeds }            ; raise bed to 15
  M402                  ; retract Euclid Probe

[gcode_macro HOME_LVL_MESH]
gcode: 
    {% set center_x = euclid_probe.position_center[0] %}
    {% set center_y = euclid_probe.position_center[1] %}     
  SET_KINEMATIC_POSITION Z={printer.configfile.config.stepper_z.position_endstop}
  G28
  M401
  _QUAD_GANTRY_LEVEL_ORIGINAL            ; home Z
  G0 X{ center_x } Y{ center_y } F{ euclid_probe.move_speeds }
  Probe
  Offset
  BED_MESH_CALIBRATE_ORIGINAL
  G0 Z{ euclid_probe.bed_clearance } F{ euclid_probe.z_speeds }            ; raise bed to 15
  M402                  ; retract Euclid Probe

[gcode_macro PROBE_CALIBRATE]
rename_existing: PROBE_CALIBRATE_ORIG
gcode:
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}  # this is the contents of line 144
       
    M401
    G90
    G0 X{ center_x } Y{ center_y } F{ euclid_probe.move_speeds }
    PROBE_CALIBRATE_ORIG
    SAVE_GCODE_STATE NAME=calibrate
    M402
    RESTORE_GCODE_STATE NAME=calibrate move=1
[gcode_macro probe_setup]
gcode:
    
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}  # this is the contents of line 144
    {% set center_x = euclid_probe.position_center[0] %}
    {% set center_y = euclid_probe.position_center[1] %}      
    G28
    M401
    G90
    G0 X{ center_x } Y{ center_y } F{ euclid_probe.move_speeds }
    MANUAL_PROBE
    M402

[gcode_macro INITIAL_SETUP]
description: Full setup sequence including homing, QGL, probe calibration, and dock position save
gcode:
    {% set svv = printer.save_variables.variables %}    
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}  # this is the contents of line 144    G28 X
    {% set center_x = euclid_probe.position_center[0] %}
    {% set center_y = euclid_probe.position_center[1] %}    
    G28 X
    G28 Y  ; Home X and Y axes
    G0 X{ center_x } Y{ center_y } F{ euclid_probe.move_speeds }
    {action_respond_info("Attach the Euclid probe to the toolhead and press 'OK' to continue.")}
    RESPOND TYPE=command MSG="action:prompt_begin OKPrompt"
    RESPOND TYPE=command MSG="action:prompt_text Please attach probe attached proceeding." 
    RESPOND TYPE=command MSG="action:prompt_button Continue Setup|SETUP_RUN_QGL|success"
    RESPOND TYPE=command MSG="action:prompt_show"
    
[gcode_macro SETUP_RUN_QGL]
description: Run Quad Gantry Level after probe attachment
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set euclid_probe = printer["gcode_macro EuclidProbe"] %} 
    {% set z = printer.configfile.config.stepper_z.position_endstop %}
    {% set exit_x = euclid_probe.position_exit[0] %}
    {% set exit_y = euclid_probe.position_exit[1] %}
    {% set zmax = printer.toolhead.axis_maximum.z %}
    SET_KINEMATIC_POSITION Z={ zmax }
    Probe
    Offset
    _QUAD_GANTRY_LEVEL_ORIGINAL
    Probe
    Offset
    G0 Z{ z }
    G0 X{ exit_x } Y{exit_y }
    SHOW_MOVE_PROMPT

[gcode_macro RUN_PROBE_CALIBRATION]
description: Run probe calibration to set offset
gcode:
    {% set svv = printer.save_variables.variables %}
    PROBE_CALIBRATE_ORIG
    {action_respond_info("Probe calibration complete! Move the toolhead to the dock and press 'OK' to save the dock position.")}
    RESPOND TYPE=command MSG="Confirm Dock Position" CMD="SAVE_DOCK_POSITION"

[gcode_macro SAVE_DOCK_POSITION]
description: Save the dock position after user confirmation
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set x = printer.toolhead.position.x %}
    {% set y = printer.toolhead.position.y %}
    SAVE_VARIABLE VARIABLE=dock_x VALUE={x}
    SAVE_VARIABLE VARIABLE=dock_y VALUE={y}
    {action_respond_info("Dock position saved! Setup complete.")}
[gcode_macro offset]
gcode:
  {% set euclid_probe = printer["gcode_macro EuclidProbe"] %}
  SET_KINEMATIC_POSITION Z={printer.configfile.config.probe.z_offset }
  G0 Z10 F900
#G92 z{ printer.probe.last_z_result}