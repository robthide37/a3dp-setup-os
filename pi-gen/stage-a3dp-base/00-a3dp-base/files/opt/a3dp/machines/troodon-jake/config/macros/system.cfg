# a3dpTR300 — webui/machine infrastructure: mcu_flasher include, respond, virtual_sdcard, pause_resume, display_status, idle_timeout, timelapse hooks, G32, DUMP_VARIABLES (split out of webui_macros.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[include mcu_flasher.cfg]
[respond]
default_type: echo
default_prefix: //
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: PAUSE_PRINT
[pause_resume]

[display_status]

[idle_timeout]
gcode:
    {% if printer.pause_resume.is_paused %}
      M104 S0
    {% else %}
      LIGHTS_OFF
      TURN_OFF_HEATERS
      M84
    {% endif %}
timeout: 3600

[gcode_macro TIMELAPSE_TAKE_FRAME]
gcode:
 {action_call_remote_method("timelapse_newframe")}

[gcode_macro TIMELAPSE_RENDER]
gcode:
 {action_call_remote_method("timelapse_render")}
                              
[gcode_macro G32]
gcode:

#    FORCE_MOVE STEPPER=stepper_z2 DISTANCE=2 VELOCITY=20
#    FORCE_MOVE STEPPER=stepper_z1 DISTANCE=2 VELOCITY=20
    {% if "xyz" in printer.toolhead.homed_axes %}
    BED_MESH_CLEAR
    QUAD_GANTRY_LEVEL
    G0 X200 Y200 Z20 F18000 
    {% else %}
    BED_MESH_CLEAR
    G28 
    QUAD_GANTRY_LEVEL
    G0 X200 Y200 Z20 F18000 
    {% endif %} 
[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
