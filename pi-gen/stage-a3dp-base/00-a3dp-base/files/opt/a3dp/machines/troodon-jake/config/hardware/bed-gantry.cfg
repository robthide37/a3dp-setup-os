# a3dpTR300 — heater_bed + quad_gantry_level + bed_mesh (split from printer.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[heater_bed]
heater_pin: !PA19 #PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC13 #PF3
#control: pid
min_temp: -20
max_temp: 160
#control : pid
#pid_kp : 60.625
#pid_ki : 1.727
#pid_kd : 531.987
#smooth_time: .05
max_power : .9
pwm_cycle_time:.005

[quad_gantry_level]
#   Use QUAD_GANTRY_LEVEL to level a gantry.
gantry_corners:
   -68,-10 #-68,-16
   368,380 #568,555
#   Min & Max gantry corners - measure from nozzle at MIN (0,0) and MAX (250,250) to respective belt positions
points:
   #50,70
   #50,410
   #410,410
   #410,70
   20,50    #Jake Euclid QGL Points
   20,260
   235,260
   235,50 
   
#   Probe points
speed: 500 #800
horizontal_move_z: 15 #20
retries: 5
retry_tolerance: 0.01
max_adjust: 15

[bed_mesh]
mesh_min: 30,30 #5
mesh_max: 290, 290 #505,520
probe_count: 15,15 #21,21
#fade_start: 1.0
#fade_end: 4.0
algorithm: bicubic
speed: 300 #400 #500
horizontal_move_z: 15 #12

