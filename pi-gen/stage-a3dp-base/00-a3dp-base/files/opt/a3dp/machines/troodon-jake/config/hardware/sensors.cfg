# a3dpTR300 — filament sensor, dyze500 thermistor def, verify_heater, RPI/mcu/chamber temp sensors (split from printer.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[filament_switch_sensor switch_sensor]
switch_pin: PD10 #PG11
pause_on_runout: False
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament switch runout
insert_gcode:
  M117 Filament switch inserted

#[filament_motion_sensor encoder_sensor]
#switch_pin: PG15
#detection_length: 7.2
#extruder: extruder
#pause_on_runout: False
#runout_gcode:
#  PAUSE # [pause_resume] is required in printer.cfg
#  M117 Filament encoder runout
#insert_gcode:
#  M117 Filament encoder inserted
[thermistor dyze500]
temperature1 : 25
resistance1 : 4500000
temperature2 : 200
resistance2 : 8070
temperature3 : 400
resistance3 : 253
[verify_heater extruder]
max_error: 240
#check_gain_time:
hysteresis: 10
#heating_gain: 2
#RPI TEMP
[temperature_sensor RPI]
#sensor_type: rpi_temperature # alternate def
sensor_type: temperature_host
sensor_path:/sys/class/thermal/thermal_zone0/temp
[adc_temperature stm32f1_mcu]  # Also valid for stm32f0 mcus
temperature1: 25
voltage1: 1.430
temperature2: 125
voltage2: 1.000 # voltage1 - 100 * .004300

