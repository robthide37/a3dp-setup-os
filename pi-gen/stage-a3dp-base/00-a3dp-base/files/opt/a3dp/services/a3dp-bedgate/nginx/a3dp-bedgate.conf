# a3dp-bedgate — LAN-only reverse proxy for the bed-occupancy gate daemon.
# Daemon itself binds 127.0.0.1:8084 (unit: a3dp-bedgate.service).
# Detection workers (off-box lane) POST /api/occupancy through this.
# Installed by a3dp-firstboot when the machine profile selects a3dp-bedgate.
server {
    listen 8083;
    server_name _;
    access_log /var/log/nginx/bedgate-access.log;
    error_log /var/log/nginx/bedgate-error.log;

    # LAN allowlist — keep in sync with the machine's Moonraker
    # trusted_clients policy (RFC1918). Never open to the WAN.
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
