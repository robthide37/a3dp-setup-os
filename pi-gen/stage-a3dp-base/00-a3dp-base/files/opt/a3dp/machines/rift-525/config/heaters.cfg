[heater_bed]
control: watermark
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
#control: pid
min_temp: -20
max_temp: 160
#control : pid
#pid_kp : 60.625
#pid_ki : 1.727
#pid_kd : 531.987
#smooth_time: .05
max_power : .9
pwm_cycle_time: 0.100



[thermistor dyze500]
temperature1 : 25
resistance1 : 4500000
temperature2 : 200
resistance2 : 8070
temperature3 : 400
resistance3 : 253
[verify_heater extruder]
max_error: 240
#check_gain_time:
hysteresis: 10
#heating_gain: 2


