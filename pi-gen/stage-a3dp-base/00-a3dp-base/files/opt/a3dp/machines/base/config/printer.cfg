# A3DP placeholder config — active because no machine profile matched
# (hostname prefix not in the map and no /boot/firmware/a3dp-machine.conf).
# See README "Flash + activate". Safe state: no motion, no heaters.
[mcu]
serial: /dev/null

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

# A3DP remote-access macros (REMOTE_SETUP / RESTART_MONITOR) — see README
# "Customer onboarding"; backed by [gcode_shell_command] in moonraker.conf.
[include macros/a3dp-remote.cfg]
# AI bed-occupancy gate, machine-side layer (image v0.1.4). Fail-open/dry-run:
# the gate macros are present and the daemon runs, but a fresh unit boots with
# bed_clear=True / no verdicts — the gate is INERT until a detection worker
# posts an occupancy verdict. Wrappers are stripped (this placeholder defines
# no probe routines to wrap); hooks attach when a real machine config lands.
[include macros/bed-gate.cfg]
