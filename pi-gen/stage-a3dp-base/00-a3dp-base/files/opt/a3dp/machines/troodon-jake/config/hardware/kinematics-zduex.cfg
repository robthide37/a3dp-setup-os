# a3dpTR300 — stepper_z..z3 + TMC2660 ×4 (Duet2/Duex SPI) + SX1509 expander (split from printer.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[stepper_z]

step_pin: PD2 #PF13
dir_pin: PD28 #PF12
enable_pin: !PC6 #!PF14
rotation_distance: 8 #40
#gear_ratio: 80:20
microsteps: 16 #1
full_steps_per_rotation: 200 #4000
step_pulse_duration:.0000025
#position_endstop:8
endstop_pin: ^!head0:PB10 #!head0:PB11
position_max: 360 #1000
position_min: -10 #-3
homing_speed: 20 #10
[tmc2660 stepper_z]
cs_pin:  PD23
spi_bus: usart1
interpolate: True
run_current: 1
idle_current_percent: 40
sense_resistor: 0.051
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 6
driver_TOFF: 5

##On Drive E4
[stepper_z1]
step_pulse_duration:.0000025
step_pin: PD1 #PG0
dir_pin: !PD22 #!PG1
enable_pin: !PC6 #!PF15
rotation_distance: 8 #40
#gear_ratio: 80:20
microsteps: 16 #1
full_steps_per_rotation: 200 #4000
[tmc2660 stepper_z1]
cs_pin: PD24
spi_bus: usart1
interpolate: True
run_current: 1
idle_current_percent: 40
sense_resistor: 0.051
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 6
driver_TOFF: 5

##On Drive E5
[stepper_z2]
step_pulse_duration:.0000025
step_pin: PD0 #PF11
dir_pin: PD16 #PG3
enable_pin: !PC6 #!PG5
rotation_distance: 8 #40
#gear_ratio: 80:20
microsteps: 16 #1
full_steps_per_rotation: 200 #4000
[tmc2660 stepper_z2]
cs_pin: PD25
spi_bus: usart1

interpolate: True
run_current: 1
idle_current_percent: 40
sense_resistor: 0.051
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 6
driver_TOFF: 5

##On Drive E6
[stepper_z3]
step_pulse_duration:.0000025
step_pin: PD3 #PG4
dir_pin: !PD17 #!PC1
enable_pin: !PC6 #!PA0
rotation_distance: 8 #40
#gear_ratio: 80:20
microsteps: 16 #1
full_steps_per_rotation: 200 #4000
[tmc2660 stepper_z3]
cs_pin: PD26
spi_bus: usart1
interpolate: True
run_current: 1
idle_current_percent: 40
sense_resistor: 0.051
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 6
driver_TOFF: 5
[sx1509 duex]
i2c_address: 62
