# macros.cfg — a3dpmeter copy. Verbatim lift of the reference-20250930 root
# macros.cfg with TWO deltas (marked inline): bare [ringing_test] and [pa_test]
# sections commented out — invalid on the unit's Kalico build (2026-11-03).
[idle_timeout]
gcode:
    {% if printer.pause_resume.is_paused %}
      M104 S0
    {% else %}
      SET_PIN PIN=light VALUE=0
      TURN_OFF_HEATERS
      M84
    {% endif %}
    timeout: 3600
[virtual_sdcard]
path: /home/pi/printer_data/gcodes

[pause_resume]

[display_status]
[firmware_retraction]

retract_length: .8
retract_speed: 60.0

#unretract_extra_length: 0.0

unretract_speed: 30.0
z_hop_height: 0.4

[gcode_macro M601]
description: pause translator
gcode:
    PAUSE
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    ##### set park positon for x and y #####
    # default is your max posion from your printer.cfg
    {% set x_park = printer.toolhead.axis_maximum.x|float - 300.0 %}
    {% set y_park = printer.toolhead.axis_minimum.y|float + 60.0 %}
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G1 Z{z_safe} F900
      G90
      G1 X{x_park} Y{y_park} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %} 
    
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}  
    RESUME_BASE {get_params}

[firmware_retraction]
retract_length: 1.2
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 30
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 20
#   The speed of unretraction, in mm/s. The default is 10 mm/s.
[gcode_macro PRINT_START8]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    G1 X150 Y0 F2000 ; move to prime
    G92 E0 ; reset extrusion distance
    G1 Z0.8 F2000 ; get ready to prime
    G1 X200 E8 F1000 ; Unretract and wipe
    G1 X300 E30 F2000 ; prime nozzle
    G1 X350  F3000 ; quick wipe   
[gcode_macro PRINT_START6]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    G1 X150 Y0 F2000 ; move to prime
    G92 E0 ; reset extrusion distance
    G1 Z0.6 F2000 ; get ready to prime
    G1 X200 E6 F1000 ; Unretract and wipe
    G1 X300 E20 F2000 ; prime nozzle
    G1 X350  F3000 ; quick wipe   
[gcode_macro PRINT_START4]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    G1 X150 Y0 F4000 ; move to prime
    G92 E0 ; reset extrusion distance
    G1 Z0.4 F2000 ; get ready to prime
    G1 X200 E4 F1000 ; Unretract and wipe
    G1 X300 E16 F2000 ; prime nozzle
    G1 X350  F3000 ; quick wipe

[gcode_macro PRINT_START2]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode: 
    G1 X50 Y0 F4000 ; move to prime
    G92 E0 ; reset extrusion distance
    G1 Z0.16 F2000 ; get ready to prime
    G1 X100 E2 F1000 ; Unretract and wipe
    G1 X200 E4 F2000 ; prime nozzle
    G1 X250  F3000 ; quick wipe
    
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X2.0 Y2.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z20 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X150 Y270 F3600       ; park nozzle at center 
    
    
