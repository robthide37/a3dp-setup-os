# Sensors — moved verbatim from live printer.cfg 2026-11-15 (t_a0980f4a)
[axis_twist_compensation]
speed: 50
horizontal_move_z: 5
mesh_min: 30,30
mesh_max: 480,480
probe_count: 3,3
# z_compensations filled by AXIS_TWIST_COMPENSATION_CALIBRATE (real values via SAVE_CONFIG)

[axis_twist_compensation cartographer]

[lis2dw]
cs_pin: head0:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z
#spi_speed: 5000000
#spi_bus: spi2
#cs_pin: rpi:None

#spi_speed:2500000 #if connection dropouts try enable

#[adxl345] #experimental board working on 
#cs_pin: head0:PB10
#spi_software_sclk_pin: head0:PA13
#spi_software_mosi_pin: head0:PA14
#spi_software_miso_pin: head0:PB11
#axes_map: -z,x,-y
[resonance_tester]
accel_chip: adxl345
probe_points: 212.5,212.5,40
accel_per_hz: 50
max_freq: 200
hz_per_sec: 1


#accel_per_hz: 75
#max_freq: 100
#hz_per_sec: 1
#method: pulses
#max_smoothing:.1
[filament_switch_sensor switch_sensor]
switch_pin: PG11
pause_on_runout: False
event_delay: 4.0

runout_gcode:
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        PAUSE
        M117 Filament runout detected
    {% else %}
        {action_respond_info("Runout ignored — printer not actively printing")}
    {% endif %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=0
insert_gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=1
    M117 Filament detected

[filament_motion_sensor encoder_sensor]
switch_pin: PG15
detection_length: 7.2
extruder: extruder
pause_on_runout: False
event_delay: 3.0
runout_gcode:
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        PAUSE
        M117 Filament runout detected
    {% else %}
        {action_respond_info("Runout ignored — printer not actively printing")}
    {% endif %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=0
insert_gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=1
    M117 Filament detected

[temperature_sensor RPI]
#sensor_type: rpi_temperature # alternate def
sensor_type: temperature_host
sensor_path:/sys/class/thermal/thermal_zone0/temp

[adc_temperature stm32f1_mcu]  # Also valid for stm32f0 mcus
temperature1: 25
voltage1: 1.430
temperature2: 125
voltage2: 1.000 # voltage1 - 100 * .004300

