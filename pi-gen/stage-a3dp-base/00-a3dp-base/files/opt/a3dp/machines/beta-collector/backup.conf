# beta-collector: repoint the daily config backup at the kit's data dir.
# Frames are excluded (8 GB cache, pull-transported — not backup material);
# verdicts/manifests/config.ini/state ARE backed up (14 rotating tars).
SRC=/home/pi/kit-data
DST=/home/pi/kit-data_backups/agent
EXCLUDES="--exclude=frames"
