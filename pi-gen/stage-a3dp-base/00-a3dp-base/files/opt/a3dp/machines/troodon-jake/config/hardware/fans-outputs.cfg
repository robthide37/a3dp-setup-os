# a3dpTR300 — fans (hotendtool, print fan, AirPurifier), chamber temp_fan, output pins + LEDs + onboard_led (split from printer.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

#[output_pin light]
#pin:PB11
#   The pin to configure as an output. This parameter must be
#   provided.
#pwm: False
#   Set if the output pin should be capable of pulse-width-modulation.
#   If this is true, the value fields should be between 0 and 1; if it
#   is false the value fields should be either 0 or 1. The default is
#   False.
#value:1
[heater_fan hotendtool]
pin: head0:PA8   # "FAN1"
heater: extruder
heater_temp: 50.0
fan_speed: 1
#cycle_time:.05
[fan]
##	Print Cooling Fan - CNC_FAN0
pin: PC23 #PA8   #PA8
kick_start_time: 0.1
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively

cycle_time:.008
#[controller_fan drivers]
#pin: PD13
#heater: extruder,heater_bed
#fan_speed:.9
[output_pin FAN3]  ### Enabled for testing
pin: sx1509_duex:PIN_12
pwm: True
hardware_pwm: True # Only hardware PWM fans are supported

[fan_generic AirPurifier]  #### Fan2 Air Purifier in Ceiling ####
pin: PA0 ##Fan2 on Duet2 Wifi
#pin: sx1509_duex:PIN_15 #Fan2#  #15
max_power: 1.0
#cycle_time:.008
#hardware_pwm: True

[temperature_fan chamber]
pin:sx1509_duex:PIN_4
#max_power:
#shutdown_speed:
#cycle_time:
hardware_pwm: True
#kick_start_time:

sensor_type:EPCOS 100K B57560G104F
sensor_pin:PC12
control : pid
pid_kp : 30
pid_ki : 1
pid_kd : 900
pid_deriv_time:120
min_temp:0
max_temp:80
target_temp: 0.0
max_speed: .7
#min_speed: 0.5
gcode_id:Chamber
###########------------------------TROODON LIGHTS--------###################
#TROODON Stock LEDs
[output_pin ledgreen]
pin: sx1509_duex:PIN_7
pwm: True
hardware_pwm: True
cycle_time: 0.008
value:1

[output_pin ledred]
pin: sx1509_duex:PIN_6
pwm: True
hardware_pwm: True
cycle_time: 0.008
value:1

[output_pin ledblue]
pin: sx1509_duex:PIN_5
pwm: True
hardware_pwm: True
cycle_time: 0.008
value:1

#LED Light Bars - Plugged into Heater E1
[output_pin LED_Light_Bars]
pin: !PA16
pwm: True
hardware_pwm: True
cycle_time: 0.008
value:0

[static_digital_output onboard_led]
pins: !PC2
