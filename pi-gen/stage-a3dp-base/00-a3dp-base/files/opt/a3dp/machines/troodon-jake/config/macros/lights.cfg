# a3dpTR300 — LED light macros (output pins themselves live in hardware/fans-outputs.cfg) (split out of webui_macros.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[gcode_macro LIGHTS_OFF]
gcode:    
    SET_PIN PIN=ledblue VALUE=0.0
    SET_PIN PIN=ledgreen VALUE=0.0
    SET_PIN PIN=ledred VALUE=0.0
    SET_PIN PIN=LED_Light_Bars VALUE=0
    
[gcode_macro LIGHTS_ON]
gcode:    
    SET_PIN PIN=ledblue VALUE=1.0
    SET_PIN PIN=ledgreen VALUE=1.0
    SET_PIN PIN=ledred VALUE=1.0 
    SET_PIN PIN=LED_Light_Bars VALUE=1

                             
