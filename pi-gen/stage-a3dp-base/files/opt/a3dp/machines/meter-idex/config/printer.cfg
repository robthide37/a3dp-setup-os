[quad_gantry_level]
#   Use QUAD_GANTRY_LEVEL to level a gantry.
gantry_corners:
    -181,-58
    1049,1066
    #   Min & Max gantry corners - measure from nozzle at MIN (0,0) and MAX (250,250) to respective belt positions
points:
    40,50
    40,850
    900,850
    900,50
    #   Probe points
    
speed: 500
horizontal_move_z:30
retries: 5
retry_tolerance: 0.02
max_adjust: 20


[bed_mesh]
mesh_min: 20,0
mesh_max: 920,920
probe_count: 20
fade_start: 1.0
fade_end: 10.0
algorithm: bicubic
speed: 300
move_check_distance: 3
split_delta_z: .01
horizontal_move_z: 10


[thermistor dyze500]
temperature1 : 25
resistance1 : 4500000
temperature2 : 200
resistance2 : 8070
temperature3 : 400
resistance3 : 253

[verify_heater extruder]
max_error: 240
#check_gain_time:
hysteresis: 10
#heating_gain: 2

[force_move]
enable_force_move: True
[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 76.8
#shaper_type_y = mzv
#shaper_freq_y = 47.0
#enabled_extruders: extruder
#[temperature_sensor MCU_(Octopus)]
#sensor_type: temperature_mcu
#min_temp: 0
#max_temp: 100

## ---------------------------------------------
## Fans
# Hotend fans live on the NiteHawks (HEF gpio5 + tacho gpio16, ppr 2).
[heater_fan Tool-1]
pin: head0:gpio5
tachometer_pin: head0:gpio16
tachometer_ppr: 2
heater: extruder
heater_temp: 80.0
fan_speed: 1
cycle_time:.05
[heater_fan Tool-2]
pin: head1:gpio5
tachometer_pin: head1:gpio16
tachometer_ppr: 2
heater: extruder1
heater_temp: 80.0
fan_speed: 1
cycle_time:.05
[temperature_fan MCU_Enclosure_(Pi)]
pin:PD15
sensor_type: temperature_host
sensor_path:/sys/class/thermal/thermal_zone0/temp
max_speed: 1
min_speed: 0
off_below:.3
control : pid
pid_kp : 30
pid_ki : 1
pid_kd : 900
pid_deriv_time:90
min_temp:10
max_temp:95
target_temp: 50

# Fans for part layers — wired to the Octopus outputs (wiring guide page 2:
# Layer Fan Prim / Layer Fan Sec). NiteHawk PCF (gpio6) is NOT used unless the
# bench check shows the part fans are actually on the toolheads.
# Primary Extruder print cooling fan
[fan_generic fan]
pin: PA8
cycle_time: 0.0100
kick_start_time: 1.00

# Secondary Extruder print cooling fan
[fan_generic fan1]
pin: PE5
cycle_time: 0.0100
kick_start_time: 1.000

## ---------------------------------------------


[temperature_sensor ToolBoard_Primary]
sensor_type: temperature_mcu  # rp2040 internal temp (NiteHawk)
sensor_mcu: head0
min_temp: 0
max_temp: 100

[temperature_sensor ToolBoard_Secondary]
sensor_type: temperature_mcu
sensor_mcu: head1
min_temp: 0
max_temp: 100



# Octopus Pro v1.0 pinout (HE0/HE1/HE2 driving SSRs/lights per the wiring
# guide). ⚠ v1.1 delta if silkscreen reads v1.1: BedSSR PA2->PA0,
# EnclosureLights PB10->PB0 (AuxSSR PA3 unchanged).
[output_pin BedSSR]   # SET_PIN PIN=BedSSR VALUE=1 (or VALUE=0)
pin: PA2
pwm: True
value:0

[output_pin AuxSSR]   # SET_PIN PIN=AuxSSR VALUE=1 (or VALUE=0)
pin: PA3
pwm: True
value:0

[output_pin EnclosureLights]   # SET_PIN PIN=EnclosureLights VALUE=0 (or VALUE=1)
pin: PB10
pwm: True
value:1
cycle_time:.008

[gcode_macro Service_Position_Primary]
gcode:
    # M291 S3 R"Move Head To Front" P"Press OK to continue, or CANCEL to abort"
    G90
    T0
    G1 X400.0 Y5.0 Z220.0 F10000 ;
    
[gcode_macro Go_Ready_Primary]
gcode:
    # M291 S3 R"Move Head To X300 Y300 Z10" P"Press OK to continue, or CANCEL to abort"
    G90
    T0
    G0 X0 Y0 Z10.0 F10000
    
    
[gcode_macro BED_ON]
gcode:
    SET_PIN PIN=BedSSR VALUE=1
[gcode_macro BED_OFF]
gcode:
    SET_PIN PIN=BedSSR VALUE=0
    
[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=EnclosureLights VALUE=1
[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=EnclosureLights VALUE=0
[filament_switch_sensor primary]
pause_on_runout: True
#runout_gcode:
#insert_gcode:
#event_delay: 3.0
#pause_delay: 0.5
switch_pin: PG11
#   The pin on which the switch is connected. This parameter must be
#   provided.
[filament_switch_sensor secondary]
pause_on_runout: True
#runout_gcode:
#insert_gcode:
#event_delay: 3.0
#pause_delay: 0.5
switch_pin: PG15
#   The pin on which the switch is connected. This parameter must be
#   provided.
# [include moonraker_obico_macros.cfg]  # obico not installed on this unit yet
[include Dual.cfg]

# SAVE_CONFIG block from the reference machine (input_shaper smoother values,
# extruder PIDs, z_offset, 4 bed meshes at THEIR bed geometry) was deliberately
# STRIPPED — this unit re-tunes from scratch (SHAKE_TUNE / PID_CALIBRATE /
# PROBE_CALIBRATE + BED_MESH_CALIBRATE per runbook Step 5).
#
# Reference-machine quirks NOT carried over (checked 2026-11-03):
# - [include timelapse.cfg] — the zip root tree has no timelapse.cfg (broken
#   include on the source backup); wire the moonraker timelapse component
#   first if timelapse is wanted on this unit.
# - [mcu head2] + [extruder_stepper t1e] — no 3rd toolboard on this unit.
# - [adc_temperature stm32f1_mcu] / ADC_TEMPERATURE toolhead sensor — STM32-only.
