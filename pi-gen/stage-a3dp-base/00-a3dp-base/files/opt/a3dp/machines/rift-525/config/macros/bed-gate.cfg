# bed-gate.cfg — AI bed-occupancy gate, MACHINE-SIDE layer (Rift 525 / a3dp525)
# Task t_1ce4ee85. Gate logic: printer. Companion daemon (coder): see GATE-CONTRACT.md.
#
# DESIGN RULE — FAIL OPEN: daemon death, stale state, or a never-written variable must
# never strand the machine unprintable. Defaults below are the fail-open state; the
# only fail-CLOSED signal is an explicit fresh daemon verdict that the bed is occupied.
#
# Klipper Jinja has no wall-clock source, so staleness is measured with a klippy-side
# tick counter: [delayed_gcode BED_GATE_TICK] increments every 60 s; the daemon resets
# it on every state write. No daemon contact for stale_ticks ticks => gate offline =>
# pass with a console warning.
#
# Override story (always human, always logged):
#   BED_GATE_OVERRIDE MINUTES=10  — console/KlipperScreen override, self-expires
#   daemon API override           — sets the same variables over Moonraker (see contract)

# ---------------------------------------------------------------- state container
[gcode_macro BED_GATE]
description: Bed-occupancy gate state (written by a3dp-bedgate daemon via Moonraker)
# FAIL-OPEN defaults: clear + never-updated. The daemon replaces these with verdicts.
variable_bed_clear: True
variable_ticks_since_update: 999   # 999 = never contacted => stale => pass with warning
variable_stale_ticks: 5            # 5 ticks x 60 s = 5 min without daemon contact
variable_override_active: False
variable_override_ticks_left: 0    # minutes; counted down by BED_GATE_TICK
variable_override_by: ""
variable_last_reason: ""
gcode:

# ------------------------------------------------------- klippy-side tick counter
[delayed_gcode BED_GATE_TICK]
# No wall clock in Jinja: this 60 s tick is the machine's only time source.
# It also ages out human overrides.
# Kalico: no `interval` option — repeat via self-rescheduling UPDATE_DELAYED_GCODE
# (calling it inside the timer body sets repeat=True; next wake = +DURATION).
initial_duration: 60
gcode:
    UPDATE_DELAYED_GCODE ID=BED_GATE_TICK DURATION=60
    {% set gate = printer["gcode_macro BED_GATE"] %}
    SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=ticks_since_update VALUE={gate.ticks_since_update|int + 1}
    {% if gate.override_ticks_left|int > 0 %}
        {% if gate.override_ticks_left|int - 1 == 0 %}
            SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=override_active VALUE=False
            SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=override_ticks_left VALUE=0
            {action_respond_info("BED GATE: human override expired — full checking resumed")}
        {% else %}
            SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=override_ticks_left VALUE={gate.override_ticks_left|int - 1}
        {% endif %}
    {% endif %}

# ---------------------------------------------------------------- the check itself
[gcode_macro _BED_GATE_CHECK]
description: Internal bed-occupancy gate. Aborts the calling stream when blocked.
# Master kill switch (maintenance only — always logged). BED_GATE_DISABLE/ENABLE.
variable_gate_enabled: True
gcode:
    {% set self = printer["gcode_macro _BED_GATE_CHECK"] %}
    {% set gate = printer["gcode_macro BED_GATE"] %}
    {% set reason = params.REASON|default("unknown") %}
    {% set force = params.FORCE|default(0)|int %}
    {% if not self.gate_enabled %}
        {action_respond_info("BED GATE: DISABLED by kill switch — passing (logged)")}
    {% else %}
        {% set state = printer.print_stats.state|default("standby") %}
        {% set dur = printer.print_stats.print_duration|default(0)|float %}
        # Mid-print (>=60 s in) the bed is legitimately occupied by the running part:
        # block homing/probe/mesh/QGL, but never re-block the running print itself.
        {% set midprint = (state == "printing") and (dur > 60.0) %}
        {% if midprint and reason != "print_start" %}
            {action_raise_error("BED GATE: %s blocked — print in progress (bed occupied by running job)"|format(reason))}
        {% elif midprint %}
            {action_respond_info("BED GATE: print_start preflight skipped — job already active")}
        {% elif gate.ticks_since_update|int > gate.stale_ticks|int %}
            {action_respond_info("BED GATE: daemon offline/stale (%s ticks) — FAIL OPEN, passing"|format(gate.ticks_since_update))}
        {% elif gate.override_active %}
            {action_respond_info("BED GATE: human override active (%s) — passing"|format(gate.override_by))}
        {% elif not gate.bed_clear %}
            {% if force == 1 %}
                SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=last_reason VALUE={ "'" ~ '"FORCE_past_occupied_bed_check"' ~ "'" }
                {action_respond_info("BED GATE: FORCE — %s proceeding on occupied bed (logged)"|format(reason))}
            {% else %}
                # NOTE: action_* calls fire at TEMPLATE-RENDER time; a raise here would
                # abort the render BEFORE the SET line below ever executes. The raise
                # therefore lives in _BED_GATE_BLOCK, which runs after the SET at
                # gcode-execution time.
                SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=last_reason VALUE={ "'" ~ '"blocked_' ~ reason|replace(' ', '_') ~ '_bed_occupied"' ~ "'" }
                _BED_GATE_BLOCK REASON={reason}
            {% endif %}
        {% endif %}
    {% endif %}

# ------------------------------------------------------------------ human controls
[gcode_macro _BED_GATE_BLOCK]
description: Internal — raises the gate-block error at gcode-execution time
gcode:
    {action_raise_error("BED GATE: bed occupied — " ~ params.REASON ~ " BLOCKED. To override: BED_GATE_OVERRIDE MINUTES=10 then retry.")}

[gcode_macro BED_GATE_OVERRIDE]
description: Human override of the bed gate (logged). Self-expires after MINUTES.
# NOTE: SET_GCODE_VARIABLE VALUE is parsed via ast.literal_eval on a whitespace-split
# param — string literals must contain NO spaces (use underscores).
gcode:
    {% set mins = params.MINUTES|default(10)|int %}
    SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=override_active VALUE=True
    SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=override_ticks_left VALUE={mins}
    SET_GCODE_VARIABLE MACRO=BED_GATE VARIABLE=override_by VALUE={ "'" ~ '"console_' ~ mins|string ~ 'min"' ~ "'" }
    {action_respond_info("BED GATE: human override ACTIVE for %d min (logged)"|format(mins))}

[gcode_macro BED_GATE_STATUS]
description: Report bed-gate state (no motion)
gcode:
    {% set gate = printer["gcode_macro BED_GATE"] %}
    {% set online = "online" if gate.ticks_since_update|int <= gate.stale_ticks|int else "OFFLINE/stale" %}
    {action_respond_info("BED GATE: bed_clear=%s ticks=%d/%d override=%s by=%s left=%d last=%s daemon=%s"|format(gate.bed_clear, gate.ticks_since_update|int, gate.stale_ticks|int, gate.override_active, gate.override_by, gate.override_ticks_left|int, gate.last_reason, online))}

[gcode_macro BED_GATE_DISABLE]
description: Kill switch — disable all gate checks (maintenance, logged)
gcode:
    SET_GCODE_VARIABLE MACRO=_BED_GATE_CHECK VARIABLE=gate_enabled VALUE=False
    {action_respond_info("BED GATE: DISABLED — all checks bypass until BED_GATE_ENABLE")}

[gcode_macro BED_GATE_ENABLE]
description: Re-enable bed-gate checks after BED_GATE_DISABLE
gcode:
    SET_GCODE_VARIABLE MACRO=_BED_GATE_CHECK VARIABLE=gate_enabled VALUE=True
    {action_respond_info("BED GATE: ENABLED")}

# ------------------------------------------------- builtin wrappers (probe-routine class)
# These cover the routines that bypass PRINT_START: bed mesh, gantry level.
#
# G28/homing is NOT directly gated — deliberately. Two structural blockers:
#  1) gcode_macro rename_existing is impossible for traditional commands: the
#     dispatcher reads only the first letter+number token (args_r in gcode.py),
#     so any renamed 'G28' dispatches as 'G28' again -> recursion.
#  2) [homing_override] cannot coexist with this machine's [safe_z_home]
#     (klippy: "homing_override and safe_z_homing cannot be used simultaneously"),
#     and replacing safe_z_home to fit homing_override would reimplement the
#     machine's Z-homing safety — rejected.
# Residual: a standalone G28 (e.g. KlipperScreen home button) is ungated. All
# homing INSIDE PRINT_START is gated by the print_start preflight.
# BED_MESH_CALIBRATE / QUAD_GANTRY_LEVEL are non-traditional names -> rename works.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
    _BED_GATE_CHECK REASON=bed_mesh
    _BED_MESH_CALIBRATE_BASE {% for p in params %}{p}{% if params[p] %}={params[p]}{% endif %} {% endfor %}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL_BASE
gcode:
    _BED_GATE_CHECK REASON=qgl
    _QUAD_GANTRY_LEVEL_BASE {% for p in params %}{p}{% if params[p] %}={params[p]}{% endif %} {% endfor %}
