# =============================================================================
# A3DP IDEX "big meter" kit — MACHINE CONFIG LAYER (unit: a3dpmeter @ Rob's shop)
# Assembled 2026-11-03 for printer-hardware task t_4aaea5a4 (PIN-MAP GATE cleared).
#
# BASE: reference-20250930/printer.cfg — A3DP's own kit-development config for
# THIS machine (Mainsail backup config-20250930-104343.zip, sha256 618595ff...,
# KB knowledge/projects/meter-kit/reference-config/). NOT Brent's live config.
# Machine-agnostic assets (macros.cfg, Dual.cfg, mainsail.cfg) lifted verbatim.
#
# BOARD TOPOLOGY (Rob-confirmed 2026-11-03 — supersedes the 10/31 "2x rp2040"
# assumption; the two rp2040s are the TOOLHEADS, not main+head0):
#   [mcu]       main  = BTT Octopus Pro (STM32H723), USB CDC
#               -> /dev/serial/by-id/@A3DP_MCU_MAIN@
#   [mcu head0] PRIM  = LDO NiteHawk-36 (rp2040), USB path 1-1.1.2 (ttyACM0)
#               -> /dev/serial/by-id/@A3DP_MCU_HEAD0@
#   [mcu head1] SEC   = LDO NiteHawk-36 (rp2040), USB path 1-1.2.2 (ttyACM1)
#               -> /dev/serial/by-id/@A3DP_MCU_HEAD1@
#   USB serials are chip IDs — unique per board, stable across reboots.
#   MCU names head0/head1 are KEPT from the reference so the verbatim-lifted
#   assets (Dual.cfg, macros.cfg, euclid.cfg) stay byte-compatible.
#
# PIN-MAP PROVENANCE:
# - Main board: reference config pins are an exact match for the BTT
#   Octopus Pro **v1.0** (H723) pinout — verified against Klipper
#   generic-bigtreetech-octopus-pro-v1.0.cfg (Driver3 en !PA0, HE0 PA2 ->
#   BedSSR, HE1 PA3 -> AuxSSR, HE2 PB10 -> Lights, runout PG11/PG15).
#   ⚠ v1.1 boards differ in 3 pins (HE0 PA0, HE2 PB0, Driver3 en PA2) —
#   if the board silkscreen reads v1.1, apply the delta block at the
#   output_pin section before bench power-up.
# - Toolheads: LDO NiteHawk-36 official map (docs.ldomotors.com +
#   MotorDynamicsLab/Nitehawk-36 Configs/nitehawk-36.cfg).
# - Connector ROLES: A3DP-Takoto wiring guide rev KN240506 page 2
#   (knowledge/projects/meter-kit/reference-config/wiring-guide-extract.md).
#
# ⚠ BENCH VERIFICATION STILL REQUIRED (first-motion session, Rob at the bench):
# motor axis/direction sanity, endstop hits, heater->toolhead mapping, fan
# roles (Layer Fan Prim/Sec on the Octopus vs NiteHawk PCF), Euclid probe
# polarity. Nothing motion/heater-capable is trusted until then.
# =============================================================================

# Flash/update from the Mainsail/KlipperScreen UI (FLASH_MCU macro; per-board
# [mcu_flasher] sections live in moonraker.conf include meter-mcu-flasher.cfg
# — clients never SSH in).
[include macros/mcu_flasher.cfg]

[mcu]
# BTT Octopus Pro (STM32H723) — USB CDC by-id re-enumerated live 2026-11-03 (ttyACM2).
# Firmware: Kalico v2026.10.00-177-g84b3e373 (flashed 2026-11-02 via ROM DFU;
# canonical bin + verified kconfig in ~/printer_data/config/firmware/).
serial: /dev/serial/by-id/@A3DP_MCU_MAIN@
# Brent-family CAN alternate (UUIDs never carry between boards; re-enumerate via
# `python3 ~/klipper/scripts/canbus_query.py can0`):
#canbus_uuid=00ef159faacc
#[mcu rpi]
#serial: /tmp/klipper_host_mcu

# Modix Big meter idex
[danger_options]
#error_on_unused_config_options: False
#   If an unused config option or section should cause an error
#   if False, will warn but allow klipper to still run.
#   The default is True.
#log_statistics: True
#   If statistics should be logged
#   (helpful for keeping the log clean during development)
#   The default is True.
#log_config_file_at_startup: True
#   If the config file should be logged at startup
#   The default is True.
#log_bed_mesh_at_startup: True
#   If the bed mesh should be logged on startup
#   (helpful for keeping the log clean during development)
#   The default is True.
#log_shutdown_info: True
#   If we should log detailed crash info when an exception occurs
#   Most of it is overly-verbose and fluff and we still get a stack trace
#   for normal exceptions, so setting to False can help save time while developing
#   The default is True.
allow_plugin_override: False
#   Allows modules in `plugins` to override modules of the same name in `extras`
#   The default is False.
#multi_mcu_trsync_timeout: 0.075
#   The timeout (in seconds) for MCU synchronization during the homing process when
#   multiple MCUs are in use. The default is 0.025
#homing_elapsed_distance_tolerance: 0.5
#   Tolerance (in mm) for distance moved in the second homing. Ensures the
#   second homing distance closely matches the `min_home_dist` when using
#   sensorless homing. The default is 0.5mm.
#adc_ignore_limits: False
#   When set to true, this parameter ignores the min_value and max_value
#   limits for ADC temperature sensors. It prevents shutdowns due to
#   'ADC out of range' errors by allowing readings outside the specified
#   range without triggering a shutdown. Default is False.
#autosave_includes: False
#   When set to true, SAVE_CONFIG will recursively read [include ...] blocks
#   for conflicts to autosave data. Any configurations updated will be backed
#   up to configs/config_backups.
#bgflush_extra_time: 0.250
#   This allows to set extra flush time (in seconds). Under certain conditions,
#   a low value will result in an error if message is not get flushed, a high value
#   (0.250) will result in homing/probing latency. The default is 0.250
[printer]
kinematics: cartesian

max_z_velocity:25
#   See cartesian above.
max_velocity:800
#   In order to get maximum velocity gains on diagonals, this should be equal or
#   greater than the hypotenuse (sqrt(x*x + y*y)) of max_x_velocity and
#   max_y_velocity.
max_accel:2200
#   This sets the maximum acceleration (in mm/s^2) of movement along
#   the x axis. It limits the acceleration of the x stepper motor. The
#   default is to use max_accel for max_x_accel.

#   This sets the maximum acceleration (in mm/s^2) of movement along
#   the y axis. It limits the acceleration of the y stepper motor. The
#   default is to use max_accel for max_y_accel.
max_z_accel:240
# See cartesian above.


#   When true, scales the XY limits by the current tool head acceleration.
#   The factor is: slicer accel / hypot(max_x_accel, max_y_accel).
#   See below.
# printer.cfg

[gcode_arcs]
resolution: .1
[adxl345] # PRIM toolhead — NiteHawk-36 onboard ADXL345 (software SPI per LDO config)
cs_pin: head0:gpio27
spi_software_sclk_pin: head0:gpio18
spi_software_mosi_pin: head0:gpio20
spi_software_miso_pin: head0:gpio19
#[adxl345]
#cs_pin: rpi:None
#spi_speed:2500000 #if connection dropouts try enable
#[adxl345] #experimental board working on 
#cs_pin: head1:PB10
#spi_software_sclk_pin: head1:PA13
#spi_software_mosi_pin: head1:PA14
#spi_software_miso_pin: head1:PB11
#axes_map: -z,x,-y

[resonance_tester]
accel_chip: adxl345
probe_points:
    300,300,40  # an example
    #accel_per_hz: 50 #default 75
    #max_freq: 80
    #hz_per_sec: 1
    #method: pulses
    #max_smoothing:.1
    
    
[exclude_object]


# ---------------------------------------------------------------------------
# MAIN-BOARD SECTIONS (steppers/outputs below): reference-20250930 pins are
# carried over 1:1 — the reference machine's main board is the same Octopus
# Pro v1.0 (H723) pinout as this unit, and connector roles follow the wiring
# guide page 2 (header order X YN -> X YP -> Y SEC -> Y PRIM -> 4x Z).
# ---------------------------------------------------------------------------
[include macros.cfg]

[mcu head0]
# PRIM toolhead — LDO NiteHawk-36 (rp2040, USB CDC). Rob-confirmed PRIM
# 2026-11-03 (the BOOTSEL'd board, katapult-flashed first; path 1-1.1.2 = ttyACM0).
serial: /dev/serial/by-id/@A3DP_MCU_HEAD0@
restart_method: command
# Brent-family CAN alternates (head0 clean historical UUID per A3dp/printer.cfg:51;
# the reference zip line is paste-corrupted — never copy it):
#canbus_uuid=3957e9990806

[mcu head1]
# SEC toolhead — LDO NiteHawk-36, Rob-confirmed SEC 2026-11-03 (path 1-1.2.2 = ttyACM1).
serial: /dev/serial/by-id/@A3DP_MCU_HEAD1@
restart_method: command
# Reference machine had a 3rd CAN toolhead ([mcu head2], carrying only the
# extruder_stepper t1e co-motor). This unit has no head2 board — the t1e
# sections are deliberately dropped (see comment at their original position).                                                      

[include euclid.cfg]

[extruder]

# PRIM toolhead — NiteHawk-36 pins (LDO official map). dir polarity is the
# official NiteHawk convention; motor-direction sign is a bench-verify item.
step_pin: head0:gpio23
dir_pin: head0:gpio24
enable_pin: !head0:gpio25
heater_pin: head0:gpio9  # "HE0"
rotation_distance :7.26
microsteps: 16
nozzle_diameter: 0.600
filament_diameter: 1.750
sensor_type: PT1000
sensor_pin: head0:gpio29 # "TH0"
pullup_resistor: 2200 # The board uses a 2.2k ohm pullup to work with a PT1000 
min_temp: -250
max_temp: 450
max_extrude_only_distance: 151.0
# Safe default until bench PID_CALIBRATE (the reference ran control=pid via its
# SAVE_CONFIG block, which is deliberately stripped from this unit).
control: watermark
pressure_advance : .008
pressure_advance_smooth_time: .02
#smooth_time: .1
#per_move_pressure_advance: True
[tmc2209 extruder]
uart_pin: head0:gpio0
tx_pin: head0:gpio1
interpolate: True
run_current: .6 #0.58
sense_resistor: 0.100
#stealthchop_threshold: 0
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 1
driver_TOFF: 4
# [extruder_stepper t1e] DROPPED 2026-11-03: on the reference machine this
# co-motor lived on a 3rd CAN toolboard ([mcu head2]); this unit has only two
# NiteHawk toolheads. If a co-motor shows up in the kit wiring, re-add it on
# the correct board after bench confirmation.

[extruder1]
# SEC toolhead — NiteHawk-36 pins (same official map as PRIM).
step_pin: head1:gpio23
dir_pin: head1:gpio24
enable_pin: !head1:gpio25
heater_pin: head1:gpio9  # "HE0"
rotation_distance :7.26
microsteps: 64
nozzle_diameter: 0.600
filament_diameter: 1.750
sensor_type: PT1000
sensor_pin: head1:gpio29 # "TH0"
pullup_resistor: 2200 # The board uses a 2.2k ohm pullup to work with a PT1000 
min_temp: -50
max_temp: 450
max_extrude_only_distance: 151.0
control: watermark
pressure_advance : .008
pressure_advance_smooth_time: .02
smooth_time: .1

[tmc2209 extruder1]
uart_pin: head1:gpio0
tx_pin: head1:gpio1
interpolate: False
run_current: 0.52
sense_resistor: 0.100
stealthchop_threshold: 0
driver_TBL: 1
driver_HEND: 10
driver_HSTRT: 7
driver_TOFF: 4

[stepper_x]

enable_pin: !PD4
step_pin: PE2
dir_pin: !PE3
rotation_distance: 40
microsteps: 1
full_steps_per_rotation: 8000
endstop_pin:PG6
position_endstop: 0
position_max: 1005
position_min: -1
#homing_retract_dist: 3
homing_speed: 150
step_pulse_duration:.0000025
#high_precision_step_compress: True
[stepper_x1]
enable_pin: !PE0
step_pin: PE6
dir_pin: PA14
endstop_pin:PG9
rotation_distance: 40
microsteps: 1
full_steps_per_rotation: 8000
step_pulse_duration:.0000025
#high_precision_step_compress: True
[stepper_y]
enable_pin: !PG2
step_pin: PF9
dir_pin: PF10
rotation_distance: 32
microsteps: 1
full_steps_per_rotation: 6400
# Y endstop = PRIM toolhead's endstop input (NiteHawk XES port gpio13;
# reference used HUVUD PA14). Polarity (!) is a bench-verify item.
homing_positive_dir: false
endstop_pin: !head0:gpio13
position_endstop:-12
position_max: 1005
position_min: -13
homing_speed: 150
homing_retract_dist: 2
step_pulse_duration:.0000025
#high_precision_step_compress: True
[dual_carriage]
axis:y
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
rotation_distance: 32
microsteps: 1
full_steps_per_rotation:8000
homing_positive_dir: true
step_pulse_duration:.000003
# Y endstop = SEC toolhead's endstop input (NiteHawk XES port gpio13;
# reference used HUVUD PA13). Polarity (!) is a bench-verify item.
endstop_pin:!head1:gpio13
position_endstop:1040
position_min:42
position_max:1040
homing_speed: 100
[stepper_z]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14

rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000
step_pulse_duration:.0000025
endstop_pin:probe:z_virtual_endstop
position_max: 1000
position_min: -12
homing_speed: 4
#high_precision_step_compress: True
[stepper_z1]
step_pulse_duration:.0000025
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
#high_precision_step_compress: True
rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000

[stepper_z3]
step_pulse_duration:.0000025
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000
#high_precision_step_compress: True
[stepper_z2]
step_pulse_duration:.0000025

step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
rotation_distance: 4
gear_ratio: 2.5:1
microsteps: 1
full_steps_per_rotation: 4000
#high_precision_step_compress: True
