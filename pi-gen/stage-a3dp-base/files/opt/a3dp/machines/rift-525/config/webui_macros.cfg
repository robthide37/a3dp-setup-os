[include macros/mcu_flasher.cfg]
[respond]
default_type: echo
default_prefix: //
#[include mainsail.cfg]
[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: PAUSE
[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    {% if printer.pause_resume.is_paused|default(False) %}
        {action_respond_info("Already paused — ignoring PAUSE")}
    {% else %}
        SAVE_GCODE_STATE NAME=PAUSE_state

        {% set E = printer["gcode_macro PAUSE"].extrude|float %}
        {% set x_park = printer.toolhead.axis_maximum.x|float - 200.0 %}
        {% set y_park = printer.toolhead.axis_maximum.y|float - 295.0 %}
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% set z_safe = 2.0 if act_z < (max_z - 2.0) else (max_z - act_z) %}

        PAUSE_BASE

        G91
        {% if printer.extruder.can_extrude|lower == 'true' %}
          G1 E-{E} F2100
        {% endif %}

        {% if "xyz" in printer.toolhead.homed_axes %}
          G1 Z{z_safe} F900
          G90
          G1 X{x_park} Y{y_park} F6000
        {% endif %}
    {% endif %}


[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    {% if not printer.pause_resume.is_paused|default(False) %}
        {action_respond_info("Not paused — ignoring RESUME")}
    {% else %}
        {% set E = printer["gcode_macro PAUSE"].extrude|float %}
        {% set get_params = ("VELOCITY=" + params.VELOCITY) if 'VELOCITY' in params|upper else "" %}

        G91
        {% if printer.extruder.can_extrude|lower == 'true' %}
          G1 E{E} F2100
        {% endif %}

        RESTORE_GCODE_STATE NAME=PAUSE_state
        RESUME_BASE {get_params}
    {% endif %}


[gcode_arcs]
resolution: .1
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[firmware_retraction]
retract_length: 1.2
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 30
#   The speed of retraction, in mm/s. The default is 20 mm/s.
#unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 20
#   The speed of unretraction, in mm/s. The default is 10 mm/s.
z_hop_height: 0.6
#   The vertical height by which the nozzle is lifted from the print to
#   prevent collisions with the print during travel moves when retracted.
#   The minimum value is 0 mm, the default value is 0 mm, which disables
#   zhop moves. The value will be reduced if the zhop move reaches
#   maximum z.
#clear_zhop_on_z_moves: False
#   If True, when a change in Z is sent while toolhead is retracted,
#   z_hop is cancelled until next retraction. Otherwise,
#   `z_hop_height` is applied as an offset to all movements.
[gcode_macro LINE_PURGE]
description: Simple, safe front-line purge
gcode:
    # --- Settings ---
    {% set purge_x = 20 %}
    {% set purge_y = 5 %}
    {% set purge_z = 0.3 %}
    {% set purge_length = 120 %}
    {% set purge_extrude = 12 %}
    {% set travel_speed = printer.toolhead.max_velocity * 60 %}

    # --- Use firmware retraction if available ---
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = "G10" %}
        {% set UNRETRACT = "G11" %}
    {% else %}
        {% set RETRACT = "G1 E-0.5 F2100" %}
        {% set UNRETRACT = "G1 E0.5 F2100" %}
    {% endif %}

    M118 LINE purge starting

    G90
    G0 X{purge_x} Y{purge_y} F{travel_speed}
    G0 Z{purge_z} F2000

    M83
    {UNRETRACT}
    G1 E{purge_extrude} F1200
    G1 X{purge_x + purge_length} E{purge_extrude} F1500
    {RETRACT}

    G92 E0
    M82
    G0 Z5 F3000

    M118 LINE purge complete

    
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10 F3600                ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 X5.0 Y5.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z25 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X0 Y0 F3600       ; park nozzle at center rear
    
 
## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"
[gcode_macro FILAMENT_FLAGS]
variable_inserted: 0
gcode:
    # Storage macro for variables

[gcode_macro LOAD_LOOP_VARS]
variable_count: 0
gcode:
    # Storage macro for safely looping load steps

[gcode_macro LOAD_FILAMENT_UNTIL_SENSOR]
description: Safely feed filament in small steps until sensor detects it
gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_FLAGS VARIABLE=inserted VALUE=0
    SET_GCODE_VARIABLE MACRO=LOAD_LOOP_VARS VARIABLE=count VALUE=0
    G91
    M117 Loading filament...
    RUN_SAFE_LOAD_STEP

[gcode_macro RUN_SAFE_LOAD_STEP]
gcode:
    {% set current_count = printer["gcode_macro LOAD_LOOP_VARS"].count | int %}
    # Safely checks the actual hardware state directly from your switch_sensor
    {% set sensor_detected = printer["filament_switch_sensor switch_sensor"].filament_detected %}

    {% if sensor_detected or printer["gcode_macro FILAMENT_FLAGS"].inserted == 1 %}
        G90
        M117 Filament detected!
        G91
        G1 E15 F200 ; Safe final slow purge into hotend
        G90
        M117 Load complete
    {% elif current_count >= 200 %}
        G90
        M117 Load timeout — no filament detected
        {action_raise_error("Filament load failed: Timeout reached without sensor trip.")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=LOAD_LOOP_VARS VARIABLE=count VALUE={current_count + 1}
        G1 E2 F900
        UPDATE_DELAYED_GCODE ID=load_loop_timer DURATION=0.05
    {% endif %}

[delayed_gcode load_loop_timer]
gcode:
    RUN_SAFE_LOAD_STEP


[gcode_macro MEASURE_UNLOAD_LENGTH]
description: Interactive unload distance measurement
gcode:
    # 1. Reset our local storage trackers so we start calculating from 0.0mm
    SET_GCODE_VARIABLE MACRO=UNLOAD_SAVE VARIABLE=accumulated_dist VALUE=0.0
    G92 E0 ; Reset Extruder position
    G91
    G1 E-10 F300 ; Initial small pull to clear the melt zone
    G90
    # 2. Store that initial 10mm move into our running tracker
    SET_GCODE_VARIABLE MACRO=UNLOAD_SAVE VARIABLE=accumulated_dist VALUE=10.0
    SHOW_UNLOAD_PROMPT

[gcode_macro SHOW_UNLOAD_PROMPT]
description: Interactive screen prompt for manual retraction tuning
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Measure Unload Distance"
    RESPOND TYPE=command MSG="action:prompt_text Pull filament back until it clears your extruder gears completely. Press SAVE when done."
    RESPOND TYPE=command MSG="action:prompt_button Retract 10mm|UNLOAD_RETRACT_10|primary"
    RESPOND TYPE=command MSG="action:prompt_button Retract 100mm|UNLOAD_RETRACT_100"
    RESPOND TYPE=command MSG="action:prompt_button Retract 200mm|UNLOAD_RETRACT_200"
    RESPOND TYPE=command MSG="action:prompt_button SAVE DISTANCE|UNLOAD_SAVE|success"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro UNLOAD_RETRACT_10]
gcode:
    {% set current = printer["gcode_macro UNLOAD_SAVE"].accumulated_dist | float %}
    SET_GCODE_VARIABLE MACRO=UNLOAD_SAVE VARIABLE=accumulated_dist VALUE={current + 10.0}
    G91
    G1 E-10 F1200
    G90
    SHOW_UNLOAD_PROMPT

[gcode_macro UNLOAD_RETRACT_100]
gcode:
    {% set current = printer["gcode_macro UNLOAD_SAVE"].accumulated_dist | float %}
    SET_GCODE_VARIABLE MACRO=UNLOAD_SAVE VARIABLE=accumulated_dist VALUE={current + 100.0}
    G91
    G1 E-100 F1200
    G90
    SHOW_UNLOAD_PROMPT

[gcode_macro UNLOAD_RETRACT_200]
gcode:
    {% set current = printer["gcode_macro UNLOAD_SAVE"].accumulated_dist | float %}
    SET_GCODE_VARIABLE MACRO=UNLOAD_SAVE VARIABLE=accumulated_dist VALUE={current + 200.0}
    G91
    G1 E-200 F1200
    G90
    SHOW_UNLOAD_PROMPT

[gcode_macro UNLOAD_SAVE]
variable_accumulated_dist: 0.0
gcode:
    # Pull the total aggregated math out of our script tracker
    {% set final_dist = printer["gcode_macro UNLOAD_SAVE"].accumulated_dist | float %}
    SAVE_VARIABLE VARIABLE=unload_length VALUE={final_dist}
    {action_respond_info("Unload length successfully saved to disk: " ~ final_dist ~ "mm")}
    M117 Saved: {final_dist}mm
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro UNLOAD_FILAMENT]
description: Automatically unloads filament using your saved disk metric
gcode:
    # Fetches your saved variable value directly out of Klipper's permanent disk storage
    {% set saved_unload = printer.save_variables.variables.unload_length | default(80.0) | float %}
    M117 Unloading {saved_unload}mm
    G91
    G1 E-{saved_unload} F1200
    G90
    M117 Unload complete

