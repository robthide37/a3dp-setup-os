# a3dpTR300 — [probe] — Euclid geometry/pins (calibrated z_offset in SAVE_CONFIG) (split from printer.cfg 2026-11-13, task t_5351bc6a; sections verbatim)

[probe]
##    Euclid Probe
pin: head0:PB12              ; use pin PA0 and enable internal pullup resistor as this is an NC switch  use ! to invert if needed
x_offset: 31.0                ; probe is offset 2.0mm from nozzle
y_offset: 0.0               ; probe is +25mm from nozzle in Y direction
#z_offset: 5.7           ; trigger point is 9.5mm below nozzle. larger numbers move effective Z0 CLOSER to the nozzle
speed: 16                    ; probing speed of 5mm/second ideal is <10mm/sec  
samples: 2                   ; number of probes to perform per sample
samples_result: average      ; normalization method: see config reference
sample_retract_dist: 3.0
samples_tolerance: 0.0075  #jake 0.02
samples_tolerance_retries: 3
