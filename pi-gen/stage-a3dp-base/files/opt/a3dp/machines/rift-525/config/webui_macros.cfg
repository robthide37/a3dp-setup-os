[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}





[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    ## Update this table to adjust material settings
    {
        ## ( density, heat capacity )  # suggested heat capacity range
        "PLA"       : ( 1.25, 2.20 ),  # 1.80 - 2.20
        "PETG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PC+ABS"    : ( 1.15, 2.20 ),  # 1.50 - 2.20
        "ABS"       : ( 1.06, 2.40 ),  # 1.25 - 2.40
        "ASA"       : ( 1.07, 2.10 ),  # 1.30 - 2.10
        "PA6"       : ( 1.12, 2.50 ),  # 2.00 - 2.50
        "PA"        : ( 1.15, 2.50 ),  # 2.00 - 2.50
        "PC"        : ( 1.20, 1.90 ),  # 1.10 - 1.90
        "TPU"       : ( 1.21, 2.00 ),  # 1.50 - 2.00
        "TPU-90A"   : ( 1.15, 2.00 ),  # 1.50 - 2.00
        "TPU-95A"   : ( 1.22, 2.00 ),  # 1.50 - 2.00
        "ABS-CF"    : ( 1.11, 2.40 ),  # 1.25 - 2.40
        "ASA-CF"    : ( 1.11, 2.10 ),  # 1.30 - 2.10
        "PA6-CF"    : ( 1.19, 2.50 ),  # 2.00 - 2.50
        "PC+ABS-CF" : ( 1.22, 2.20 ),  # 1.50 - 2.20
        "PC+CF"     : ( 1.36, 1.90 ),  # 1.10 - 1.90
        "PLA-CF"    : ( 1.29, 2.20 ),  # 1.80 - 2.20
        "PETG-CF"   : ( 1.30, 2.20 ),  # 1.70 - 2.20
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}

        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity=extruder_config.filament_heat_capacity %}

        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}

# -------------------------
# Prime style setter macros
# Expose these in your Klipper menu so users pick default prime behavior
# Values: LINE, ADAPTIVE
# -------------------------
[gcode_macro SET_PRIME_LINE]
gcode:
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=prime_style VALUE='"LINE"'
  SAVE_VARIABLE VARIABLE=prime_style VALUE='"LINE"'
  M117 Prime style: LINE

[gcode_macro SET_PRIME_OFF]
gcode:
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=prime_style VALUE='"OFF"'
  SAVE_VARIABLE VARIABLE=prime_style VALUE='"OFF"'
  M117 Prime style: OFF

[gcode_macro SET_PRIME_ADAPTIVE]
gcode:
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=prime_style VALUE='"ADAPTIVE"'

  SAVE_VARIABLE VARIABLE=prime_style VALUE='"ADAPTIVE"'

  M117 Prime style: ADAPTIVE





# -------------------------
# Main PRINT_START (single macro for multiple slicers)
# -------------------------
[gcode_macro PRINT_START]
variable_prime_style: "OFF"
gcode:
  # --- Read tokens safely (try common names; fall back to defaults) ---
  {% if 'BED_TEMP' in params %}
    {% set BED_TEMP_raw = params.BED_TEMP %}
  {% elif 'bed_temp' in params %}
    {% set BED_TEMP_raw = params.bed_temp %}
  {% elif 'bed_temperature' in params %}
    {% set BED_TEMP_raw = params.bed_temperature %}
  {% elif '{bed_temperature}' in params %}
    {% set BED_TEMP_raw = params['{bed_temperature}'] %}
  {% elif 'first_layer_bed_temperature' in params %}
    {% set BED_TEMP_raw = params.first_layer_bed_temperature %}
  {% else %}
    {% set BED_TEMP_raw = 60 %}
  {% endif %}

  {% if 'EXTRUDER_TEMP' in params %}
    {% set EXTRUDER_TEMP_raw = params.EXTRUDER_TEMP %}
  {% elif 'extruder_temp' in params %}
    {% set EXTRUDER_TEMP_raw = params.extruder_temp %}
  {% elif 'first_layer_temperature' in params %}
    {% set EXTRUDER_TEMP_raw = params.first_layer_temperature %}
  {% elif 'material_print_temperature' in params %}
    {% set EXTRUDER_TEMP_raw = params.material_print_temperature %}
  {% else %}
    {% set EXTRUDER_TEMP_raw = 210 %}
  {% endif %}

  {% if 'NOZZLE' in params %}
    {% set NOZZLE_raw = params.NOZZLE %}
  {% elif 'nozzle' in params %}
    {% set NOZZLE_raw = params.nozzle %}
  {% elif 'nozzle_diameter' in params %}
    {% set NOZZLE_raw = params.nozzle_diameter %}
  {% else %}
    {% set NOZZLE_raw = 0.4 %}
  {% endif %}

  {% if 'MATERIAL' in params %}
    {% set MATERIAL_raw = params.MATERIAL %}
  {% elif 'material' in params %}
    {% set MATERIAL_raw = params.material %}
  {% elif 'filament_type' in params %}
    {% set MATERIAL_raw = params.filament_type %}
  {% else %}
    {% set MATERIAL_raw = '' %}
  {% endif %}



  {% set HOMING_TEMP_THRESHOLD = params.HOMING_TEMP_THRESHOLD|default(5.0)|float %}
  LIGHTS_ON
  # Bed-occupancy AI gate (t_1ce4ee85): hard preflight before any heat/motion
  _BED_GATE_CHECK REASON=print_start
  # --- sanitize numeric tokens (remove braces if slicer left them) ---
  {% set BED_TEMP = (BED_TEMP_raw|string).replace('{','')|replace('}','')|float %}
  {% set EXTRUDER_TEMP = (EXTRUDER_TEMP_raw|string).replace('{','')|replace('}','')|float %}
  {% set NOZZLE = (NOZZLE_raw|string).replace('{','')|replace('}','')|float %}
  {% set MATERIAL = (MATERIAL_raw|string).replace('{','')|replace('}','')|replace(' ','') %}

# --- Determine prime style: explicit param overrides saved variable ---
  {% if 'PRIME' in params %}
     {% set prime_style = params.PRIME|string|upper %}
  {% else %}
    {% set prime_style = printer.save_variables.variables.prime_style|default(printer["gcode_macro PRINT_START"].prime_style)|default("LINE")|string|upper %}
   {% endif %}

  # --- Axis travel limits (fallback defaults) ---
  {% set axis_min_x = printer.toolhead.axis_minimum.x|default(-5.0)|float %}
  {% set axis_min_y = printer.toolhead.axis_minimum.y|default(-40.0)|float %}
  {% set axis_max_x = printer.toolhead.axis_maximum.x|default(300.0)|float %}
  {% set axis_max_y = printer.toolhead.axis_maximum.y|default(300.0)|float %}

# --- Read current bed temp ---
  {% set bed_now = printer.heater_bed.temperature if printer.heater_bed is defined else None %}

# --- Read saved homing temp ---
  {% set saved_homed_temp_raw = printer.save_variables.variables.last_homed_bed_temp|default(None) %}
  {% if saved_homed_temp_raw is not none %}
    {% set saved_homed_temp = saved_homed_temp_raw|float %}
  {% else %}
    {% set saved_homed_temp = None %}
  {% endif %}

# --- Determine if we can skip homing ---
  {% set homed_axes = printer.toolhead.homed_axes|string|lower %}
  {% set skip_home = False %}

  {% if ('x' in homed_axes) and ('y' in homed_axes) and ('z' in homed_axes) %}
    {% if saved_homed_temp is not none and bed_now is not none %}
      {% set temp_diff = (bed_now - saved_homed_temp)|abs %}
      {% if temp_diff <= HOMING_TEMP_THRESHOLD %}
        {% set skip_home = True %}
      {% endif %}
    {% endif %}
  {% endif %}

# --- If homing is NOT skipped, begin coordinated heat/cool ---
  {% if not skip_home %}
    M118 Homing required — preparing bed + hotend

    # Start heating bed (no wait)
    M140 S{BED_TEMP}
    M109 S240
    G28
    G1 Z18 F600
    G1 X534 F1800
    G1 Y-38
    G1 X510 F300
    G1 Z25
    G1 X237 Y100
    M104 S140 
    # If hotend is too hot for homing, cool it during bed heating


    # Wait for bed to reach temp
    M190 S{BED_TEMP}

    # Soak time (30–60 seconds)
    G4 P60000

    # Ensure hotend is safe for homing
    {% if printer.extruder.temperature > 150 %}
      M118 Waiting for hotend to cool below 150C
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
    {% endif %}

    # Perform homing + QGL
    G32


  {% else %}
    M118 Skipping homing — temp + homed state valid
      M140 S{BED_TEMP}
    # Only heat bed if needed
    {% if bed_now is none or bed_now < (BED_TEMP - 1) %}
      M190 S{BED_TEMP}
    {% endif %}
  {% endif %}


  # --- Bed mesh profile selection: try material-named profile, else default ---
  {% set mesh_profile_to_load = "default" %}
  {% if MATERIAL %}
    {% set candidate = MATERIAL.upper().replace(' ','').replace('+','').replace('-','') %}
    {% set profiles = printer.bed_mesh.profiles if printer.bed_mesh is defined and 'profiles' in printer.bed_mesh else None %}

    {% if profiles is not none %}
      {% if candidate in profiles %}
        {% set mesh_profile_to_load = candidate %}
      {% else %}
        {% if candidate.lower() in profiles %}
          {% set mesh_profile_to_load = candidate.lower() %}
        {% else %}
          {% if candidate.startswith('PLA') and 'PLA' in profiles %}
            {% set mesh_profile_to_load = 'PLA' %}
          {% elif candidate.startswith('PETG') and 'PETG' in profiles %}
            {% set mesh_profile_to_load = 'PETG' %}
          {% elif candidate.startswith('ABS') and 'ABS' in profiles %}
            {% set mesh_profile_to_load = 'ABS' %}
          {% elif candidate.startswith('TPU') and 'TPU' in profiles %}
            {% set mesh_profile_to_load = 'TPU' %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% else %}
      {% set mesh_profile_to_load = ('default') %}
    {% endif %}
  {% endif %}

  M118 Loading bed mesh profile {mesh_profile_to_load}
  BED_MESH_PROFILE LOAD="{mesh_profile_to_load}"

  G1 Z10 F3000

  # --- Extruder temp: set and wait only if needed ---

  M104 S{EXTRUDER_TEMP}
  M109 S{EXTRUDER_TEMP}


  # --- Prime behavior selection ---
  {% if prime_style == "ADAPTIVE" %}
    M118 Prime style ADAPTIVE selected
    ADAPTIVE_PURGE
  {% elif prime_style == "OFF" %}
    M118 Prime Off
    {% endif %}


  G92 E0
  M117 Printing...

[gcode_macro ADAPTIVE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}
    
    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = G10 | string %}
        {% set UNRETRACT = G11 | string %}
    {% else %}
        {% set RETRACT = 'G1 E-.5 F2100' | string %}
        {% set UNRETRACT = 'G1 E.5 F2100' | string %}
    {% endif %}

    # Get purge settings from _ADAPTIVE_Settings
    {% set verbose_enable = printer["gcode_macro _USER_VARIABLES"].verbose_enable | abs %}
    {% set purge_height = printer["gcode_macro _USER_VARIABLES"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _USER_VARIABLES"].tip_distance | float %}
    {% set purge_margin = printer["gcode_macro _USER_VARIABLES"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _USER_VARIABLES"].purge_amount | float %}
    {% set flow_rate = printer["gcode_macro _USER_VARIABLES"].flow_rate | float %}


    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}                                  # Add margin to x min, compare to 0, and choose the larger
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}                                  # Add margin to y min, compare to 0, and choose the larger

    # Calculate purge speed
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}

        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

    {% else %}

        {% if verbose_enable == True %}

        {action_respond_info("Moving filament tip {}mms".format(                                                                 
            (tip_distance),                                                                                      
        )) }
        {% endif %}

        {% if printer.firmware_retraction is defined %}
            {action_respond_info("ADAPTIVE purge is using firmware retraction.")}
        {% else %}
            {action_respond_info("ADAPTIVE purge is not using firmware retraction, it is recommended to configure it.")}
        {% endif %}

        {% if purge_y_origin > 0 %}
        
            {action_respond_info("ADAPTIVE purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_center),
                (purge_y_origin),
                (purge_amount),
                (flow_rate),
            )) }
    
        {% else %}
    
            {action_respond_info("ADAPTIVE purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_origin),
                (purge_y_center),
                (purge_amount),
                (flow_rate),
            )) }

        {% endif %}

        SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

        {% if purge_y_origin > 0 %}                                                             # If there's room on Y, purge along X axis in front of print area

            G92 E0                                                                              # Reset extruder
            G0 F{travel_speed}                                                                  # Set travel speed
            G90                                                                                 # Absolute positioning
            G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
            G0 Z{purge_height}                                                                  # Move to purge Z height
            M83                                                                                 # Relative extrusion mode
            G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
            G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
            {RETRACT}                                                                           # Retract
            G0 X{purge_x_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
            G92 E0                                                                              # Reset extruder distance
            M82                                                                                 # Absolute extrusion mode
            G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        {% else %}                                                                              # If there's room on X, purge along Y axis to the left of print area
            
            G92 E0                                                                              # Reset extruder
            G0 F{travel_speed}                                                                  # Set travel speed
            G90                                                                                 # Absolute positioning
            G0 X{purge_x_origin} Y{purge_y_center}                                              # Move to purge position
            G0 Z{purge_height}                                                                  # Move to purge Z height
            M83                                                                                 # Relative extrusion mode
            G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
            G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
            {RETRACT}                                                                           # Retract
            G0 Y{purge_y_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
            G92 E0                                                                              # Reset extruder distance
            M82                                                                                 # Absolute extrusion mode
            G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

        {% endif %}

        RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
    
    {% endif %}


[gcode_macro G32]
gcode:
  {% set bed_now = printer.heater_bed.temperature if printer.heater_bed is defined else None %}
    {% if bed_now is not none %}
      SAVE_VARIABLE VARIABLE=last_homed_bed_temp VALUE={bed_now}
      M118 Saved homed bed temp
    {% else %}
      CLEAR_HOMING_RECORD
    {% endif %} 
#    FORCE_MOVE STEPPER=stepper_z2 DISTANCE=2 VELOCITY=20
#    FORCE_MOVE STEPPER=stepper_z1 DISTANCE=2 VELOCITY=20
    {% if "xyz" in printer.toolhead.homed_axes %}
    BED_MESH_CLEAR
    QUAD_GANTRY_LEVEL
    G0 X262 Y267 Z10 F18000 
    G28 Z
    G0 X262 Y267 Z20 F18000 
    {% else %}
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28 Z   
    G0 X262 Y267 Z20 F18000 
    {% endif %} 
[gcode_macro CLEAR_HOMING_RECORD]
gcode:
  SAVE_VARIABLE VARIABLE=last_homed_bed_temp VALUE=0
  M118 Homing record cleared

[gcode_macro SHOW_HOMING_STATUS]
gcode:
  {% set saved = printer.save_variables.variables.last_homed_bed_temp|default(None) %}
  {% set bed_now = printer.heater_bed.temperature if printer.heater_bed is defined else None %}
  {% if saved is none or saved == 0 %}
    M118 No saved homing temperature recorded
  {% else %}
    M118 Saved homing temperature recorded
  {% endif %}
  {% if bed_now is none %}
    M118 Current bed temp unknown
  {% else %}
    M118 Current bed temp available
  {% endif %}
  M118 Use SHOW_HOMING_VALUE or check save_variables on host to see value


[gcode_macro SET_NOZZLE]
description: Set nozzle size dynamically
gcode:
    {% set size = params.SIZE|float %}
    SET_GCODE_VARIABLE MACRO=CHECK_NOZZLE VARIABLE=current_nozzle VALUE={size}
    SAVE_VARIABLE VARIABLE=current_nozzle VALUE={size}
    M117 Nozzle set to {size}mm



[gcode_macro CHECK_NOZZLE]
variable_current_nozzle: 0.4
gcode:
    M117 Nozzle {printer.save_variables.variables.current_nozzle}
    # This macro doesn't need to do anything directly, it's used to store the current nozzle size
[gcode_macro CALIBRATE_Z]
gcode:
    _BED_GATE_CHECK REASON=calibrate_z
    CARTOGRAPHER_TOUCH_CALIBRATE
    CARTOGRAPHER_SCAN_CALIBRATE METHOD=touch
