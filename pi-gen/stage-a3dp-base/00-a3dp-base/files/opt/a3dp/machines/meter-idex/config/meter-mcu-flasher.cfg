# =============================================================================
# a3dpmeter — MCU flasher sections for moonraker-mcu-flasher (Rob 2026-10-31:
# client-facing MCU flashing must work from Mainsail/KlipperScreen — no SSH).
# Install: git clone moonraker-mcu-flasher to ~/, symlink its component into
# ~/moonraker/moonraker/components/, then add `[include meter-mcu-flasher.cfg]`
# to moonraker.conf and `[include macros/mcu_flasher.cfg]` to printer.cfg.
# The FLASH_MCU macro lives in config/macros/mcu_flasher.cfg (FLASH_MCU MCU=all|<name>).
#
# The component stops klipper, compiles with the section's kconfig (olddefconfig
# fills unspecified options), runs flash_cmd lines (cwd=~/klipper), restarts
# klipper and issues FIRMWARE_RESTART. Service name on this unit: klipper ✓
#
# Board set (Rob-confirmed 2026-11-03): main = BTT Octopus Pro (STM32H723,
# USB CDC); toolheads = 2x LDO NiteHawk-36 (rp2040, USB CDC). All three flash
# buttonless from `make flash` when running klipper:
#   - rp2040: klipper reboots the board into the RP2 ROM bootloader over USB.
#     A BLANK/new board cannot be commanded into the bootloader — hold BOOTSEL
#     while plugging USB (first-flash caveat).
#   - stm32h723: klipper reboots into the STM32 ROM DFU (needs dfu-util);
#     verified buttonless 2026-11-02 (runbook Step 4, t_f1891ed8).
# Serials are chip IDs re-enumerated live 2026-11-03; re-check
# `ls -l /dev/serial/by-id/` if boards are swapped or re-plugged on other ports.
# =============================================================================

[mcu_flasher octopuspro]
# main board (ttyACM2 path today): usb-Klipper_stm32h723xx_360008000851323235363233-if00
# kconfig = the live-verified 2026-11-02 build (flasher fills the rest via
# olddefconfig); full proven .config at
# ~/printer_data/config/firmware/stm32h723-kconfig-84b3e373-20261102.config.
# ⚠ Kalico kconfig: CONFIG_MACH_STM32 alone is not enough — the H723 choice
# symbol + clock ref + flash-start must be pinned or the build silently lands
# on a different MCU/boot offset.
kconfig:
  CONFIG_LOW_LEVEL_OPTIONS=y
  CONFIG_MACH_STM32=y
  CONFIG_MACH_STM32H723=y
  CONFIG_STM32_CLOCK_REF_25M=y
  CONFIG_STM32_FLASH_START_20000=y
  CONFIG_USBSERIAL=y
  CONFIG_USB_SERIAL_NUMBER_CHIPID=y
flash_cmd:
  make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32h723xx_360008000851323235363233-if00

[mcu_flasher head0]
# PRIM toolhead (NiteHawk-36, ttyACM0 path today): usb-Klipper_rp2040_313631313202864E-if00
# rp2040 kconfig proven on this unit 2026-10-31 (olddefconfig vs Kalico
# 84b3e373): BOARD_DIRECTORY=rp2040, VID 1d50:614e (= live lsusb), chip-ID
# serial, stage2 boot2_w25q080. NOTE: Kalico renamed the choice symbol to
# MACH_RPXXXX — CONFIG_MACH_RP2040=y alone is IGNORED by kconfiglib (falls
# back to AVR). Full verified .config: flash/rp2040-kconfig-verified.config
kconfig:
  # CONFIG_MACH_AVR is not set
  # CONFIG_MACH_ATSAM is not set
  # CONFIG_MACH_ATSAMD is not set
  # CONFIG_MACH_LPC176X is not set
  # CONFIG_MACH_STM32 is not set
  # CONFIG_MACH_HC32F460 is not set
  CONFIG_MACH_RPXXXX=y
  # CONFIG_MACH_PRU is not set
  # CONFIG_MACH_AR100 is not set
  # CONFIG_MACH_LINUX is not set
  # CONFIG_MACH_SIMU is not set
  # chip-ID USB serial keeps the two identical boards distinguishable:
  CONFIG_USB_SERIAL_NUMBER_CHIPID=y
flash_cmd:
  make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_313631313202864E-if00

[mcu_flasher head1]
# SEC toolhead (NiteHawk-36, ttyACM1 path today): usb-Klipper_rp2040_3136313132029F6A-if00
# identical rp2040 firmware build — same kconfig, different device:
kconfig:
  # CONFIG_MACH_AVR is not set
  # CONFIG_MACH_ATSAM is not set
  # CONFIG_MACH_ATSAMD is not set
  # CONFIG_MACH_LPC176X is not set
  # CONFIG_MACH_STM32 is not set
  # CONFIG_MACH_HC32F460 is not set
  CONFIG_MACH_RPXXXX=y
  # CONFIG_MACH_PRU is not set
  # CONFIG_MACH_AR100 is not set
  # CONFIG_MACH_LINUX is not set
  # CONFIG_MACH_SIMU is not set
  CONFIG_USB_SERIAL_NUMBER_CHIPID=y
flash_cmd:
  make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_rp2040_3136313132029F6A-if00
