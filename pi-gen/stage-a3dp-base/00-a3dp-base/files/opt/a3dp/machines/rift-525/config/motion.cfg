# Motion — moved verbatim from live printer.cfg 2026-11-15 (t_a0980f4a)
[extruder_stepper my_extra_stepper]

extruder: extruder
#   The extruder this stepper is synchronized to. If this is set to an
#   empty string then the stepper will not be synchronized to an
#   extruder. The default is "extruder".
step_pin: PC13
dir_pin: PF0 #!PF0
enable_pin: !PF1


rotation_distance:7.83
microsteps: 16
[tmc2209 extruder_stepper my_extra_stepper]
#run_current: 0.767
#sense_resistor: 0.110
#hold_current: 0.2
#stealthchop_threshold: 0
driver_TBL: 2
driver_HEND: 3
driver_HSTRT: 4
driver_TOFF: 5
run_current: .67
# hold_current: runtime showed 2.0 (kalico default with no explicit line) - motor
# cooked at 2A hold with 4h idle_timeout; explicit sane value per 2026-11-14 session
hold_current: 0.3
uart_pin: PE4

sense_resistor: 0.110
[stepper_x]

step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
endstop_pin: !head0:PA5
rotation_distance: 40
microsteps: 1
full_steps_per_rotation: 4096#6400
homing_positive_dir: true
position_endstop: 532
position_max: 535
position_min: -5
homing_speed: 150
step_pulse_duration:.0000025
homing_retract_dist: 2
#high_precision_step_compress: True
[stepper_y]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4

rotation_distance: 40
microsteps: 1
full_steps_per_rotation: 4096#6400
homing_positive_dir: true
endstop_pin:PG6
position_endstop:519
position_max: 526
position_min: -40
homing_speed: 200
homing_retract_dist: 2
step_pulse_duration:.0000025
#high_precision_step_compress: True


[stepper_z]

step_pin: PF13
dir_pin: PF12
#enable_pin: !PF14
rotation_distance: 40
gear_ratio: 80:20
microsteps: 1
full_steps_per_rotation: 4000
step_pulse_duration:.0000025
#position_endstop:8

position_max: 1000
position_min: -5
homing_speed: 10

[stepper_z1]
step_pulse_duration:.0000025
step_pin: PG0
dir_pin: !PG1
#enable_pin: !PF15
rotation_distance: 40
gear_ratio: 80:20
microsteps: 1
full_steps_per_rotation: 4000


[stepper_z2]
step_pulse_duration:.0000025
step_pin: PF11
dir_pin: PG3
#enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:20
microsteps: 1
full_steps_per_rotation: 4000

[stepper_z3]
step_pulse_duration:.0000025
step_pin: PG4
dir_pin: !PC1
#enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:20
microsteps: 1
full_steps_per_rotation: 4000

[force_move]
enable_force_move: True
[input_shaper]
#shaper_type_x = mzv
#shaper_freq_x = 76.8
#shaper_type_y = mzv
#shaper_freq_y = 47.0




#RPI TEMP
[output_pin z_en]
pin: PF14

[output_pin z1_en]
pin: PF15

[output_pin z2_en]
pin: PG5

[output_pin z3_en]
pin: PA0

