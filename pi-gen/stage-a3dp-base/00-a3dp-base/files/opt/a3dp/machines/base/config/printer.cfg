# A3DP placeholder config — active because no machine profile matched
# (hostname prefix not in the map and no /boot/firmware/a3dp-machine.conf).
# See README "Flash + activate". Safe state: no motion, no heaters.
[mcu]
serial: /dev/null

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

# A3DP remote-access macros (REMOTE_SETUP / RESTART_MONITOR) — see README
# "Customer onboarding"; backed by [gcode_shell_command] in moonraker.conf.
[include macros/a3dp-remote.cfg]
