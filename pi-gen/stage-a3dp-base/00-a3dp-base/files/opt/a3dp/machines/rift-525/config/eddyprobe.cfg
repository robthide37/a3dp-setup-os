[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
serial: /dev/serial/by-id/usb-Cartographer_614e_0D0010000643564738333920-if00
is_non_critical: True
#canbus_uuid: <blank>
#restart_method: command # Not needed for probes using CAN. 

[cartographer]
mcu: cartographer
x_offset: 35 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output



[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA3 # For Cartographer V3
#cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    212.5, 212.5, 20 
    300, 150, 40
    50, 50, 60
    450, 450, 80# Fill out the blank with x and y coordinates where you want to run the resonance test.

[safe_z_home]
home_xy_position: 262.5, 467.5 # This should be for the CENTRE OF YOUR BED.
z_hop: 10

[gcode_macro PROBE_CALIBRATE]
gcode:
     _BED_GATE_CHECK REASON=probe_calibrate
     {% if "xyz" in printer.toolhead.homed_axes %}
     CARTOGRAPHER_TOUCH_CALIBRATE
     {% else %}
     RESPOND TYPE=command MSG="action:prompt_begin make sure QGL and home done"
     {% endif %} 
[gcode_macro PROBE_SETUP]
gcode:    
    _BED_GATE_CHECK REASON=probe_setup
    RESPOND TYPE=command MSG="action:prompt_begin You will still need to run CALIBRATE"
    G28 X Y
    CARTOGRAPHER_SCAN_CALIBRATE

[quad_gantry_level]
#   Use QUAD_GANTRY_LEVEL to level a gantry.
gantry_corners:
   -68,-16
   568,555
#   Min & Max gantry corners - measure from nozzle at MIN (0,0) and MAX (250,250) to respective belt positions
points:
   80,80
   80,450
   450,450
   450,80
#   Probe points
speed: 800
horizontal_move_z:10
retries: 5
retry_tolerance: 0.012
max_adjust: 15

[bed_mesh]
zero_reference_position: 212.5, 212.5  # The centre of your bed. 
speed: 300
horizontal_move_z: 3
mesh_min: 30,10
mesh_max: 505,520
probe_count: 100,100
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough
faulty_region_1_min: 15.0, 5
faulty_region_1_max: 55.0, 55.0
